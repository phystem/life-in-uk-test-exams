<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life in the UK Exam Question Bank</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5b6780;
      --border: #d8dfeb;
      --accent: #2a5bd7;
      --accent-soft: #e9f0ff;
      --correct: #1f8f4e;
      --correct-soft: #e8f7ee;
      --wrong: #c53b37;
      --wrong-soft: #fdeceb;
      --sidebar-width: 340px;
      --sidebar-collapsed-width: 72px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0, var(--bg) 260px);
      color: var(--text);
    }

    body.sidebar-collapsed {
      --sidebar-width: var(--sidebar-collapsed-width);
    }

    .page {
      width: min(1200px, calc(100% - 32px));
      margin: 0 16px 0 calc(var(--sidebar-width) + 24px);
      padding: 24px 0 48px;
      transition: margin-left 0.25s ease;
    }

    .hero, .panel, .question-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(25, 43, 78, 0.08);
    }

    .hero {
      padding: 28px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 2vw + 1rem, 2.6rem);
    }

    .subtext {
      margin: 0;
      color: var(--muted);
      max-width: 70ch;
      line-height: 1.5;
    }

    .panel {
      position: fixed;
      left: 16px;
      top: 16px;
      bottom: 16px;
      width: var(--sidebar-width);
      padding: 18px;
      display: grid;
      gap: 14px;
      z-index: 20;
      backdrop-filter: blur(10px);
      overflow: auto;
      align-content: start;
      transition: width 0.25s ease, padding 0.25s ease;
    }

    body.sidebar-collapsed .panel {
      padding: 16px 12px;
    }

    body.sidebar-collapsed .panel .panel-body,
    body.sidebar-collapsed .panel .actions,
    body.sidebar-collapsed .panel .tabs {
      display: none;
    }

    body.sidebar-collapsed .panel .topline {
      justify-content: center;
      flex-direction: column;
      align-items: center;
    }

    body.sidebar-collapsed .timer {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      min-height: 180px;
    }

    .toolbar {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      align-items: end;
    }

    label {
      display: block;
      font-size: 0.92rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input[type="search"], select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: inherit;
      background: #fff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .question-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button.secondary {
      background: #edf2fb;
      color: var(--text);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .topline {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .panel-body {
      display: grid;
      gap: 14px;
    }

    .sidebar-toggle {
      min-width: 44px;
      padding-inline: 14px;
    }

    .timer {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid #cddafc;
      border-radius: 999px;
      padding: 10px 14px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tab-button.active {
      background: var(--accent);
      color: #fff;
    }

    .tab-button:not(.active) {
      background: #edf2fb;
      color: var(--text);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .pill {
      background: #f3f6fb;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
    }

    .questions {
      display: grid;
      gap: 16px;
    }

    .question-card {
      padding: 18px;
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .question-text {
      margin: 0 0 14px;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fcfdff;
    }

    .option.correct {
      border-color: rgba(31, 143, 78, 0.35);
      background: var(--correct-soft);
    }

    .option.incorrect {
      border-color: rgba(197, 59, 55, 0.35);
      background: var(--wrong-soft);
    }

    .option input {
      margin-top: 2px;
    }

    .answer-block {
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      background: #f8faff;
      border: 1px solid var(--border);
      display: none;
    }

    .answer-block.visible {
      display: block;
    }

    .answer-block strong {
      display: block;
      margin-bottom: 8px;
    }

    .empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 18px;
    }

    .incorrect-list {
      display: grid;
      gap: 12px;
    }

    .incorrect-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(25, 43, 78, 0.08);
    }

    .incorrect-item p {
      margin: 0 0 10px;
      line-height: 1.45;
    }

    .incorrect-item .meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .incorrect-item strong {
      display: block;
      margin-top: 8px;
    }

    .panel-note {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .panel-note a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .panel-note a:hover {
      text-decoration: underline;
    }

    .scroll-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      display: none;
      box-shadow: 0 12px 30px rgba(25, 43, 78, 0.2);
    }

    .scroll-top.visible {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 20px, 1100px);
        margin: 88px auto 0;
        padding-top: 12px;
      }

      .panel {
        position: fixed;
        left: 10px;
        right: 10px;
        top: 10px;
        bottom: auto;
        width: auto;
        max-height: calc(100vh - 20px);
      }

      body.sidebar-collapsed .panel {
        width: auto;
        right: 10px;
      }

      body.sidebar-collapsed .panel .panel-body {
        display: none;
      }

      body.sidebar-collapsed .panel .topline {
        flex-direction: row;
      }

      body.sidebar-collapsed .timer {
        writing-mode: initial;
        transform: none;
        min-height: 0;
      }

      .page {
        width: min(100% - 20px, 1100px);
      }

      .hero, .panel, .question-card {
        border-radius: 16px;
      }

      .hero {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Life in the UK Exam Question Bank</h1>
      <p class="subtext">Single-page quiz view for all 408 questions extracted from 17 exams. Filter by exam, search by keyword, answer inline, and reveal the stored answer explanations without leaving the page.</p>
    </section>

    <section class="panel">
      <div class="topline">
        <button id="sidebar-toggle" class="sidebar-toggle secondary" type="button" aria-expanded="true">Hide</button>
        <div class="timer" id="timer">00:00:00</div>
      </div>
      <div class="panel-body">
        <div class="tabs">
          <button id="tab-quiz" class="tab-button active" type="button">Quiz</button>
          <button id="tab-incorrect" class="tab-button" type="button">Incorrectly selected</button>
        </div>
        <div class="toolbar">
          <div>
            <label for="search">Search questions</label>
            <input id="search" type="search" placeholder="Search question text or answers">
          </div>
          <div>
            <label for="exam-filter">Filter by exam</label>
            <select id="exam-filter"></select>
          </div>
        </div>
        <div class="actions">
          <button id="check-all" type="button">Confirm all visible answers</button>
          <button id="toggle-explanations" class="secondary" type="button">Show all explanations</button>
          <button id="reset" class="secondary" type="button">Reset selections</button>
        </div>
        <div class="stats" id="stats"></div>
        <div class="panel-note">
          Thanks to <a href="https://lifeintheuktestweb.co.uk/" target="_blank" rel="noreferrer">lifeintheuktestweb.co.uk</a> for providing the questions.
        </div>
      </div>
    </section>

    <section id="panel-quiz" class="tab-panel active">
      <section class="questions" id="questions"></section>
    </section>

    <section id="panel-incorrect" class="tab-panel">
      <div class="incorrect-list" id="incorrect-list"></div>
    </section>

    <button id="scroll-top" class="scroll-top" type="button">Top</button>
  </main>

:["Poland"],"correctOptionIndexes":[3],"answerText":"The Second World War started when Hitler invaded Poland in 1939. Britain and France declared war in order to stop his aggression."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":2,"globalNumber":170,"question":"Which flower is associated with Scotland?","options":["The Shamrock","The Rose","The Daffodil","The Thistle"],"sourceQuestionId":"p1","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the thistle"],"correctAnswers":["The Thistle"],"correctOptionIndexes":[4],"answerText":"The flower associated with Scotland is the thistle ."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":3,"globalNumber":171,"question":"Police complaints can only be made by writing to the Chief Constable of the police force involved.","options":["True","False"],"sourceQuestionId":"p2","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["False","by going to a police station and writing to the Chief Constable of the police force involved. Complaints can also be made to an independent body: the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland or the Police Ombudsman for Northern Ireland"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False . Anyone can make a complaint about the police by going to a police station and writing to the Chief Constable of the police force involved. Complaints can also be made to an independent body: the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland or the Police Ombudsman for Northern Ireland ."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":4,"globalNumber":172,"question":"Which of the following is a responsibility of the Home Secretary?","options":["Economy","Crime","Education","Defence"],"sourceQuestionId":"p3","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["crime, policing and immigration"],"correctAnswers":["Crime"],"correctOptionIndexes":[2],"answerText":"The Home Secretary is responsible for crime, policing and immigration ."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":5,"globalNumber":173,"question":"When is St David’s day celebrated?","options":["1st March","17th March","23rd April","17th April"],"sourceQuestionId":"p4","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["1st of March"],"correctAnswers":["1st March"],"correctOptionIndexes":[1],"answerText":"St David’s day, patron of Wales, is celebrated on the 1st of March ."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":6,"globalNumber":174,"question":"What happened to ‘Mary, Queen of Scots’ after she spent 20 years in prison?","options":["She became Queen of England","She was sent to France","She escaped to Denmark","She was executed"],"sourceQuestionId":"p5","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Mary was eventually executed"],"correctAnswers":["She was executed"],"correctOptionIndexes":[4],"answerText":"Mary was eventually executed , accused of plotting against Elizabeth I."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":7,"globalNumber":175,"question":"What did Francis Crick discover?","options":["The MRI (magnetic resonance imaging) scanner","The jet engine","The IVF (in-vitro fertilisation) therapy","The structure of the DNA molecule"],"sourceQuestionId":"p6","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the structure of the DNA molecule"],"correctAnswers":["The structure of the DNA molecule"],"correctOptionIndexes":[4],"answerText":"Francis Crick discovered the structure of the DNA molecule ."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":8,"globalNumber":176,"question":"Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK.","options":["True","False"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["true"],"correctAnswers":["True"],"correctOptionIndexes":[1],"answerText":"This statement is true ."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":9,"globalNumber":177,"question":"How many national parks are there in England, Wales and Scotland?","options":["25","15","18","42"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["15"],"correctAnswers":["15"],"correctOptionIndexes":[2],"answerText":"There are 15 national parks in England, Wales and Scotland."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":10,"globalNumber":178,"question":"Is Northern Ireland part of Great Britain?","options":["Yes","No"],"sourceQuestionId":"p9","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":[],"correctAnswers":["No"],"correctOptionIndexes":[2],"answerText":"‘Great Britain’ refers only to England, Scotland and Wales, not to Northern Ireland."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":11,"globalNumber":179,"question":"If you are a dog owner, which two things should your dog’s collar have when you go out for a walk?","options":["The owner’s address","The owner’s name","The dog’s breed","The dog’s name"],"sourceQuestionId":"p10","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the name and address of the owner"],"correctAnswers":["The owner’s address","The owner’s name"],"correctOptionIndexes":[1,2],"answerText":"All dogs in public places must wear a collar showing the name and address of the owner ."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":12,"globalNumber":180,"question":"What day relates to the death of Jesus Christ?","options":["Good Friday","Easter Sunday","Easter Monday","Ash Wednesday"],"sourceQuestionId":"p11","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Good Friday"],"correctAnswers":["Good Friday"],"correctOptionIndexes":[1],"answerText":"Easter takes place in March or April. It marks the death of Jesus Christ on Good Friday and his rising from the dead on Easter Sunday."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":13,"globalNumber":181,"question":"A responsibility of the MPs is to represent everyone in their _______.","options":["County","Estate","District","Constituency"],"sourceQuestionId":"p12","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["constituency"],"correctAnswers":["Constituency"],"correctOptionIndexes":[4],"answerText":"A responsibility of the MPs is to represent everyone in their constituency ."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":14,"globalNumber":182,"question":"What was achieved with the Magna Carta?","options":["It restricted the King’s power","It increased the King’s power","It restricted the rights of the farmers","It increased women’s power"],"sourceQuestionId":"p13","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["restricted the king’s power"],"correctAnswers":["It restricted the King’s power"],"correctOptionIndexes":[1],"answerText":"The Magna Carta established the idea that even the king was subject to the law. It protected the rights of the nobility and restricted the king’s power to collect taxes or to make and change laws. In future, the king would need to involve his noblemen in decisions."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":15,"globalNumber":183,"question":"Female genital mutilation (FGM) or taking a girl or woman abroad for FGM is illegal in the UK and it is a criminal offence.","options":["True","False"],"sourceQuestionId":"p14","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["true"],"correctAnswers":["True"],"correctOptionIndexes":[1],"answerText":"This statement is true ."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":16,"globalNumber":184,"question":"What year were women given the right to vote?","options":["1918","1925","1949","1914"],"sourceQuestionId":"p15","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["1918"],"correctAnswers":["1918"],"correctOptionIndexes":[1],"answerText":"In 1918 , women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":17,"globalNumber":185,"question":"Which two of the following are British overseas territories?","options":["St Helena","Solomon Islands","Mauritius","The Falkland Islands"],"sourceQuestionId":"p16","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["St Helena and the Falkland Islands"],"correctAnswers":["St Helena","The Falkland Islands"],"correctOptionIndexes":[1,4],"answerText":"There are several British overseas territories, such as St Helena and the Falkland Islands . They are linked to the UK but are not part of it."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":18,"globalNumber":186,"question":"Who did the English defeat in 1588?","options":["The Normans","The Romans","The Spanish Armada","The Saxons"],"sourceQuestionId":"p17","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Spanish Armada"],"correctAnswers":["The Spanish Armada"],"correctOptionIndexes":[3],"answerText":"In 1588 the English defeated the Spanish Armada (a large fleet of ships)."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":19,"globalNumber":187,"question":"Who designed the Cenotaph?","options":["Sir Norman Foster","Lancelot ‘Capability’ Brown","Sir Edwin Lutyens","Isambard Kingdom Brunel"],"sourceQuestionId":"p18","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Sir Edwin Lutyens"],"correctAnswers":["Sir Edwin Lutyens"],"correctOptionIndexes":[3],"answerText":"Sir Edwin Lutyens was responsible for designing many war memorials throughout the world, including the Cenotaph in Whitehall."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":20,"globalNumber":188,"question":"How often are the members of the Welsh government elected?","options":["Every 5 years","Every 2 years","Every 4 years","Every 3 years"],"sourceQuestionId":"p19","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["every four years"],"correctAnswers":["Every 4 years"],"correctOptionIndexes":[3],"answerText":"There are 60 members of the Welsh government or members of the Senedd (SMs) and elections are held every four years using a form of proportional representation."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":21,"globalNumber":189,"question":"During which period did the Beatles become popular and social laws were liberalised?","options":["1960s","1970s","1980s","1950s"],"sourceQuestionId":"p20","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["1960s"],"correctAnswers":["1960s"],"correctOptionIndexes":[1],"answerText":"The decade of the 1960s was a period of significant social change. It was known as the ‘swinging sixties’. There was growth in British fashion, cinema and popular music. Two well-known pop music groups at the time were The Beatles and The Rolling Stones. It was also a time when social laws were liberalised, for example in relation to divorce and to abortion in England, Wales and Scotland. The position of women in the workplace also improved."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":22,"globalNumber":190,"question":"The Man Booker Prize is awarded in which of the following categories?","options":["Films","Sport","Literature","Music"],"sourceQuestionId":"p21","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the best fiction novel (literature)"],"correctAnswers":["Literature"],"correctOptionIndexes":[3],"answerText":"The Man Booker Prize for Fiction is awarded annually for the best fiction novel (literature) written by an author from the Commonwealth, Ireland or Zimbabwe. It has been awarded since 1968. Past winners include Ian McEwan, Hilary Mantel and Julian Barnes."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":23,"globalNumber":191,"question":"What sort of election takes place when a member of the Parliament (MP) dies or resigns?","options":["Coalition","Pre-selection","Random selection","By-election"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["by-election"],"correctAnswers":["By-election"],"correctOptionIndexes":[4],"answerText":"If an MP dies or resigns, there will be a fresh election, called a by-election , in his or her constituency."},{"exam":"exam-8","examTitle":"British Citizenship Test 8","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-8/","examQuestionNumber":24,"globalNumber":192,"question":"What is the Turner Prize?","options":["A literature award","A music award","A contemporary art award","A theatre award"],"sourceQuestionId":"p23","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["contemporary art"],"correctAnswers":["A contemporary art award"],"correctOptionIndexes":[3],"answerText":"The Turner Prize was established in 1984 and celebrates contemporary art . The Turner Prize is recognised as one of the most prestigious visual art awards in Europe."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":1,"globalNumber":193,"question":"Which flower is associated with Northern Ireland?","options":["The daffodil","The thistle","The shamrock","The rose"],"sourceQuestionId":"p0","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the shamrock"],"correctAnswers":["The shamrock"],"correctOptionIndexes":[3],"answerText":"The flower associated with Northern Ireland is the shamrock ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":2,"globalNumber":194,"question":"The last battle between Britain and France was the battle of Waterloo.","options":["True","False"],"sourceQuestionId":"p1","optionAnswerIds":["r0","r1"],"rawCorrectAnswers":["true"],"correctAnswers":["True"],"correctOptionIndexes":[1],"answerText":"This statement is true ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":3,"globalNumber":195,"question":"£100 is the highest value note in circulation in the UK.","options":["True","False"],"sourceQuestionId":"p2","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["false"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"This statement is false ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":4,"globalNumber":196,"question":"Where is the Lake District National Park located?","options":["Scotland","Wales","England","Northern Ireland"],"sourceQuestionId":"p3","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["England"],"correctAnswers":["England"],"correctOptionIndexes":[3],"answerText":"Lake District is in England ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":5,"globalNumber":197,"question":"Which two responsibilities will you have as a British citizen?","options":["To buy food locally","To volunteer in a community project at least once a year","To look after yourself and your family","To respect the rights of others, including their right to their own opinions"],"sourceQuestionId":"p4","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["look after yourself and your family","respect the rights of others, including their right to their own opinions,"],"correctAnswers":["To look after yourself and your family","To respect the rights of others, including their right to their own opinions"],"correctOptionIndexes":[3,4],"answerText":"If you wish to be a permanent resident or citizen of the UK, you should: respect and obey the law, look after yourself and your family , respect the rights of others, including their right to their own opinions, treat others with fairness and look after the area in which you live and the environment."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":6,"globalNumber":198,"question":"Who was born in Stratford-upon-Avon?","options":["Jane Austen","Charles Dickens","William Shakespeare","Thomas Hardy"],"sourceQuestionId":"p5","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["William Shakespeare"],"correctAnswers":["William Shakespeare"],"correctOptionIndexes":[3],"answerText":"William Shakespeare was born in Stratford-upon-Avon, England."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":7,"globalNumber":199,"question":"Why is 1928 an important year in women’s voting history?","options":["Women were given the right to vote at the age of 18, the same as men.","Women were given the right to vote at the age of 25.","Women were given the right to vote at the age of 30.","Women were given the right to vote at the age of 21, the same as men."],"sourceQuestionId":"p6","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":[],"correctAnswers":["Women were given the right to vote at the age of 21, the same as men."],"correctOptionIndexes":[4],"answerText":"Women were given the right to vote at the age of 21, the same as men."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":8,"globalNumber":200,"question":"What does Hogmanay refer to?","options":["Christmas Day in Wales","New Year’s Eve in Scotland","Christmas Day in Scotland","New Year’s Eve in Wales"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the 31st of December (New Year’s Eve)"],"correctAnswers":["New Year’s Eve in Scotland"],"correctOptionIndexes":[2],"answerText":"In Scotland, the 31st of December (New Year’s Eve) is called Hogmanay."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":9,"globalNumber":201,"question":"What is the capital city of Northern Ireland?","options":["Cork","Edinburgh","Belfast","Dublin"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Belfast"],"correctAnswers":["Belfast"],"correctOptionIndexes":[3],"answerText":"The capital city of Northern Ireland is Belfast ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":10,"globalNumber":202,"question":"Which of the following wars took place between 1899 and 1902 in South Africa?","options":["The Hundred Years War","The Boer War","The First World War","The Crimean War"],"sourceQuestionId":"p9","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The Boer War"],"correctAnswers":["The Boer War"],"correctOptionIndexes":[2],"answerText":"The Boer War ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":11,"globalNumber":203,"question":"Northern Ireland uses a system called ‘individual registration’ and all those entitled to vote must complete their own registration form.","options":["True","False"],"sourceQuestionId":"p10","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["True"],"correctAnswers":["True"],"correctOptionIndexes":[1],"answerText":"This statement is True ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":12,"globalNumber":204,"question":"Which two of the following policies are not controlled by the devolved administrations?","options":["Health","Education","Defence","Immigration"],"sourceQuestionId":"p11","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Policy and laws governing defence, foreign affairs, immigration, taxation and social security all remain under central UK government control."],"correctAnswers":["Defence","Immigration"],"correctOptionIndexes":[3,4],"answerText":"Policy and laws governing defence, foreign affairs, immigration, taxation and social security all remain under central UK government control. However, many other public services, such as education, are controlled by the devolved administrations."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":13,"globalNumber":205,"question":"How old do citizens of the UK, the Irish Republic or the Commonwealth have to be to stand for public office?","options":["18","21","16","25"],"sourceQuestionId":"p12","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["18 or over"],"correctAnswers":["18"],"correctOptionIndexes":[1],"answerText":"Most citizens of the UK, the Irish republic or the Commonwealth aged 18 or over can stand for public office. There are some exceptions, including: members of the armed forces, civil servants and people found guilty of certain criminal offences."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":14,"globalNumber":206,"question":"How did the Government promote policies of free trade during the Victorian Age?","options":["Abolishing a number of taxes on imported goods","Abolishing the exportation of local produce","Preventing the importation of cheap raw materials","Preventing the importation of cheap grain"],"sourceQuestionId":"p13","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["abolishing a number of taxes on imported goods"],"correctAnswers":["Abolishing a number of taxes on imported goods"],"correctOptionIndexes":[1],"answerText":"During Victorian times, the government began to promote policies of free trade, abolishing a number of taxes on imported goods . One example of this was the repealing of the Corn Laws in 1846. These had prevented the import of cheap grain. The reforms helped the development of the British industry, because raw materials could now be imported cheaply."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":15,"globalNumber":207,"question":"Who was Admiral Nelson?","options":["One of the tribal leaders who fought against the Romans","A British officer in charge of the British army at the Battle of Waterloo","A British general who established the authority of the English Parliament","A British officer in charge of the British fleet at the Battle of Trafalgar against the Spanish fleet"],"sourceQuestionId":"p14","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["in charge of the British fleet at the Battle of Trafalgar against the Spanish fleet"],"correctAnswers":["A British officer in charge of the British fleet at the Battle of Trafalgar against the Spanish fleet"],"correctOptionIndexes":[4],"answerText":"Admiral Nelson was in charge of the British fleet at the Battle of Trafalgar against the Spanish fleet and was killed in the battle."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":16,"globalNumber":208,"question":"During the Middle Ages, who were the serfs?","options":["Peasants who had a small area of their lord’s agricultural land","Soldiers who fought at the Battle of Trafalgar","Noblemen who formed part of the king’s council of advisers","A group of skilled people from Holland who came to England during the Middle Ages"],"sourceQuestionId":"p15","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["peasants who had a small area of their lord’s land where they could grow food"],"correctAnswers":["Peasants who had a small area of their lord’s agricultural land"],"correctOptionIndexes":[1],"answerText":"Serfs were peasants who had a small area of their lord’s land where they could grow food ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":17,"globalNumber":209,"question":"Which invention lead to the rapid development of the industry in Britain during the 18th and 19th centuries?","options":["The Radar","The Steam Power","The Jet Engine","The Turing Machine"],"sourceQuestionId":"p16","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["steam power"],"correctAnswers":["The Steam Power"],"correctOptionIndexes":[2],"answerText":"The Industrial Revolution was the rapid development of industry in Britain in the 18th and 19th centuries. Britain was the first country to industrialise on a large scale. It happened because of the development of machinery and the use of steam power ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":18,"globalNumber":210,"question":"MPs can only be contacted by post.","options":["True","False"],"sourceQuestionId":"p17","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["False","letter or telephone"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False . You can contact MPs by letter or telephone at their constituency office, or at their office in the House of Commons. In addition, many MPs, Assembly members, MSPs and MEPs hold regular local ‘surgeries’, where constituents can go in person to talk about issues that are of concern to them."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":19,"globalNumber":211,"question":"What movement challenged the authority of the Pope?","options":["The Swinging Sixties","The Reformation","The Suffragettes","The Enlightenment"],"sourceQuestionId":"p18","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The Reformation"],"correctAnswers":["The Reformation"],"correctOptionIndexes":[2],"answerText":"The Reformation was a movement against the authority of the Pope and the ideas and practices of the Roman Catholic Church."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":20,"globalNumber":212,"question":"What English King introduced the Domesday Book?","options":["King Henry V","King Henry IV","William the Conqueror","Harold, the Saxon king of England"],"sourceQuestionId":"p19","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["William the Conqueror"],"correctAnswers":["William the Conqueror"],"correctOptionIndexes":[3],"answerText":"William the Conqueror sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":21,"globalNumber":213,"question":"What did ’the Butler Act’ introduce in 1944?","options":["Free primary education in England, Wales and Scotland","Free university fees in England, Wales, Scotland and Northern Ireland","Free primary and secondary education in England, Wales and Scotland","Free secondary education in England and Wales"],"sourceQuestionId":"p20","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["free secondary education in England and Wales"],"correctAnswers":["Free secondary education in England and Wales"],"correctOptionIndexes":[4],"answerText":"Richard Austen Butler became a Conservative MP in 1923 and held several positions before becoming responsible for education in 1941. In this role, he oversaw the introduction of the Education Act 1944 (often called ‘The Butler Act’), which introduced free secondary education in England and Wales ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":22,"globalNumber":214,"question":"What is the small claims procedure?","options":["An informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer","A procedure that helps people to make small home insurance claims in certain circumstances"],"sourceQuestionId":"p21","optionAnswerIds":["r0","r1"],"rawCorrectAnswers":["an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer"],"correctAnswers":["An informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer"],"correctOptionIndexes":[1],"answerText":"The small claims procedure is an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer ."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":23,"globalNumber":215,"question":"What building was constructed in Hyde Park to hold the Great Exhibition of 1851?","options":["The Crystal Palace","Buckingham Palace","Kensington Palace","Apsley House"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Crystal Palace"],"correctAnswers":["The Crystal Palace"],"correctOptionIndexes":[1],"answerText":"In 1851, the Great Exhibition opened in Hyde Park in the Crystal Palace , a huge building made of steel and glass. Exhibits ranged from huge machines to handmade goods."},{"exam":"exam-9","examTitle":"British Citizenship Test 9","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-9/","examQuestionNumber":24,"globalNumber":216,"question":"Who was Florence Nightingale?","options":["An economist","A painter","A nurse","A poet"],"sourceQuestionId":"p23","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["a nurse","the founder of modern nursing"],"correctAnswers":["A nurse"],"correctOptionIndexes":[3],"answerText":"Florence Nightingale was a nurse . She is often regarded as the founder of modern nursing ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":1,"globalNumber":217,"question":"Who is the patron Saint of England?","options":["St George","St Patrick","St David","St Andrew"],"sourceQuestionId":"p0","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["St George"],"correctAnswers":["St George"],"correctOptionIndexes":[1],"answerText":"The patron Saint of England is St George ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":2,"globalNumber":218,"question":"Where is Loch Lomond and the Trossachs National Park located?","options":["England","Wales","Scotland","Northern Ireland"],"sourceQuestionId":"p1","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the west of Scotland"],"correctAnswers":["Scotland"],"correctOptionIndexes":[3],"answerText":"Loch Lomond and the Trossachs National Park is located in the west of Scotland ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":3,"globalNumber":219,"question":"Wales has its own established church.","options":["True","False"],"sourceQuestionId":"p2","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["False"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False . There is no established Church in Wales or Northern Ireland."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":4,"globalNumber":220,"question":"What stories are associated with Geoffrey Chaucer?","options":["The Cambridge Tales","The Eastbourne Tales","The Canterbury Tales","The London Tales"],"sourceQuestionId":"p3","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The Canterbury Tales"],"correctAnswers":["The Canterbury Tales"],"correctOptionIndexes":[3],"answerText":"Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage. This collection of poems is called The Canterbury Tales ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":5,"globalNumber":221,"question":"When is Boxing Day celebrated?","options":["31st October","26th December","24th December","01st January"],"sourceQuestionId":"p4","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the day after Christmas Day","(26th December)"],"correctAnswers":["26th December"],"correctOptionIndexes":[2],"answerText":"Boxing Day is the day after Christmas Day (26th December) and is a public holiday."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":6,"globalNumber":222,"question":"What is the name of the holiday when banks and many other businesses are closed for the day?","options":["Credit Holidays","Branch Holidays","Bank Holidays","Business Holidays"],"sourceQuestionId":"p5","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["bank holidays"],"correctAnswers":["Bank Holidays"],"correctOptionIndexes":[3],"answerText":"There are public holidays each year called bank holidays , when banks and many other businesses are closed for the day."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":7,"globalNumber":223,"question":"Why were women given the right to vote?","options":["In recognition of the contribution women made to the war effort during the First World War","In recognition of the contribution women made to the war effort during the Second World War","In recognition of the contribution women made to the war effort during the Crimean War","In recognition of the contribution women made to the war effort during the Civil War"],"sourceQuestionId":"p6","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["in recognition of the contribution women made to the war effort during the First World War"],"correctAnswers":["In recognition of the contribution women made to the war effort during the First World War"],"correctOptionIndexes":[1],"answerText":"In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":8,"globalNumber":224,"question":"What do you need to drive in the UK?","options":["An ‘L’ plate","A National Insurance Number","A valid driving licence","An ‘R’ plate"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["a driving licence"],"correctAnswers":["A valid driving licence"],"correctOptionIndexes":[3],"answerText":"In the UK, you must have a driving licence to drive on public roads."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":9,"globalNumber":225,"question":"Where does “the Fringe” festival take place?","options":["Fraserburgh","Edinburgh","Inverness","St Andrews"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Edinburgh"],"correctAnswers":["Edinburgh"],"correctOptionIndexes":[2],"answerText":"The Edinburgh Festival takes place in Edinburgh , Scotland, every summer. It is a series of different arts and cultural festivals, with the biggest and most well-known being the Edinburgh Festival Fringe (‘the Fringe’)."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":10,"globalNumber":226,"question":"How many members does the Welsh government have?","options":["150","120","90","60"],"sourceQuestionId":"p9","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["60 members"],"correctAnswers":["60"],"correctOptionIndexes":[4],"answerText":"There are 60 members of the Welsh government or members of the Senedd (SMs) and elections are held every four years using a form of proportional representation."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":11,"globalNumber":227,"question":"The names or photographs of young people found guilty of a crime can be published in newspapers or used by the media.","options":["True","False"],"sourceQuestionId":"p10","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["False","the name or photographs of the accused young person cannot be published in newspapers or used by the media"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False . Members of the public are not allowed in Youth Courts, and the name or photographs of the accused young person cannot be published in newspapers or used by the media ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":12,"globalNumber":228,"question":"What was Edward Elgar famous for?","options":["He was a musician","He was a tennis player","He was a comedian","He was an actor"],"sourceQuestionId":"p11","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["musician"],"correctAnswers":["He was a musician"],"correctOptionIndexes":[1],"answerText":"Sir Edward Elgar (1857-1934) was a musician . His best known work is probably the Pomp and Circumstance Marches. March No1 (Land of Hope and Glory) is usually played at the Last Night of the Proms at the Royal Albert Hall."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":13,"globalNumber":229,"question":"Which of the following is not a British banknote?","options":["£50","£25","£20","£5"],"sourceQuestionId":"p12","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["£25"],"correctAnswers":["£25"],"correctOptionIndexes":[2],"answerText":"There are no £25 notes in the UK."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":14,"globalNumber":230,"question":"Where does the Scottish Grand National take place?","options":["Fife","Edinburgh","Ayr","St Andrews"],"sourceQuestionId":"p13","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Ayr"],"correctAnswers":["Ayr"],"correctOptionIndexes":[3],"answerText":"The Scottish Grand National takes place at Ayr ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":15,"globalNumber":231,"question":"The laws passed after the Glorious Revolution marked the beginning of the ______.","options":["Constitutional monarchy","Constitutional republic"],"sourceQuestionId":"p14","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["constitutional monarchy"],"correctAnswers":["Constitutional monarchy"],"correctOptionIndexes":[1],"answerText":"The laws passed after the Glorious Revolution marked the beginning of the constitutional monarchy ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":16,"globalNumber":232,"question":"During the reign of Elizabeth I, a large fleet of ships was sent to England to conquer the country and to restore Catholicism, where did this fleet come from?","options":["France","Portugal","Spain","Italy"],"sourceQuestionId":"p15","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Spain"],"correctAnswers":["Spain"],"correctOptionIndexes":[3],"answerText":"Elizabeth I became one of the most popular monarchs in English history, particularly after 1588, when the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":17,"globalNumber":233,"question":"What did the Habeas Corpus Act introduce?","options":["That every prisoner has a right to a court hearing","A salary for members of Parliament (MPs)","Financial help for the unemployed, old-age pensions and free school meals","Measures to improve the conditions of workers"],"sourceQuestionId":"p16","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Every prisoner has a right to a court hearing."],"correctAnswers":["That every prisoner has a right to a court hearing"],"correctOptionIndexes":[1],"answerText":"The Habeas Corpus Act became law in 1679. This was a very important piece of legislation which remains relevant today. Habeas corpus is Latin for ‘you must present the person in court’. The Act guaranteed that no one could be held prisoner unlawfully. Every prisoner has a right to a court hearing."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":18,"globalNumber":234,"question":"What did Emmeline Pankhurst fight for?","options":["The right to liberty and security","The right for women to vote","Freedom of expression","The right to a fair trial"],"sourceQuestionId":"p17","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["to gain the vote for women"],"correctAnswers":["The right for women to vote"],"correctOptionIndexes":[2],"answerText":"Emmeline Pankhurst she set up the women’s Franchise League in 1889, which fought to get the vote in local elections for married women. In 1903 she helped found the Women’s Social and Political Union (WSPU). This was the first group whose members were called ‘suffragettes’. The group used civil disobedience as part of their protest to gain the vote for women . In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":19,"globalNumber":235,"question":"What is “the Proms”?","options":["An annual event that gives awards in a range of categories, such as best British group and best British solo artist","An annual cultural festival which includes music, dance, art and original performances largely in Welsh","An eight-week summer season of daily orchestral classical music concerts","Light-hearted plays with music and comedy"],"sourceQuestionId":"p18","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["an eight-week summer season of orchestral classical music"],"correctAnswers":["An eight-week summer season of daily orchestral classical music concerts"],"correctOptionIndexes":[3],"answerText":"The Proms is an eight-week summer season of orchestral classical music that takes place in various venues, including the Royal Albert Hall in London."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":20,"globalNumber":236,"question":"What was Isaac Newton known for?","options":["The discovery of insulin","The discovery of gravity","The discovery of penicillin","The discovery of steam power"],"sourceQuestionId":"p19","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["gravity"],"correctAnswers":["The discovery of gravity"],"correctOptionIndexes":[2],"answerText":"Newton‘s most famous published work was Philosophiae Naturalis Principia Mathematica (‘Mathematical Principle of Natural Philosophy’), which showed how gravity applied to the whole universe."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":21,"globalNumber":237,"question":"When did the WWI come to an end?","options":["In 1922","In 1918","In 1945","In 1943"],"sourceQuestionId":"p20","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["1918"],"correctAnswers":["In 1918"],"correctOptionIndexes":[2],"answerText":"The World War I ended in 1918 ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":22,"globalNumber":238,"question":"Who built a wall in the north of England to keep out the Picts (ancestors of the Scottish people)?","options":["Boudicca","Emperor Hadrian","Emperor Claudius","Julius Caesar"],"sourceQuestionId":"p21","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Emperor Hadrian"],"correctAnswers":["Emperor Hadrian"],"correctOptionIndexes":[2],"answerText":"The Emperor Hadrian built a wall in the north of England to keep out the Picts (ancestors of the Scottish people)."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":23,"globalNumber":239,"question":"Which two universities participate in an annual rowing race that takes place on the River Thames?","options":["The University of Oxford","The University of Cambridge","The University of Manchester","The University of Warwick"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Oxford and Cambridge Universities"],"correctAnswers":["The University of Oxford","The University of Cambridge"],"correctOptionIndexes":[1,2],"answerText":"Rowing is also popular, both as a leisure activity and as a competitive sport. There is a popular yearly race on the Thames between Oxford and Cambridge Universities ."},{"exam":"exam-10","examTitle":"British Citizenship Test 10","examUrl":"https://lifeintheuktestweb.co.uk/british-naturalization-test-10/","examQuestionNumber":24,"globalNumber":240,"question":"Does Britain have a written constitution?","options":["Yes","No"],"sourceQuestionId":"p23","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["‘unwritten’"],"correctAnswers":["No"],"correctOptionIndexes":[2],"answerText":"The British constitution is not written down in any single document, and therefore it is described as ‘unwritten’ ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":1,"globalNumber":241,"question":"Is St Helena part of the UK?","options":["Yes","No"],"sourceQuestionId":"p0","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["not part of it"],"correctAnswers":["No"],"correctOptionIndexes":[2],"answerText":"British overseas territories, such as St Helena and the Falkland Islands are linked to the UK but are not part of it ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":2,"globalNumber":242,"question":"Where is Theatreland?","options":["Docklands","London’s East End","London’s West End","London’s South End"],"sourceQuestionId":"p1","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["London’s West End"],"correctAnswers":["London’s West End"],"correctOptionIndexes":[3],"answerText":"London’s West End , also known as ‘Theatreland’, is particularly well known for its theatres."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":3,"globalNumber":243,"question":"What is the name of the UK currency?","options":["Euro","Pound Sterling","Peso","Dollar"],"sourceQuestionId":"p2","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["pound sterling"],"correctAnswers":["Pound Sterling"],"correctOptionIndexes":[2],"answerText":"The currency in the UK is the pound sterling (symbol £)."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":4,"globalNumber":244,"question":"What other name is given to Diwali?","options":["The Festival of Lights","Ash Wednesday","Good Friday","Easter Monday"],"sourceQuestionId":"p3","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Festival of Lights"],"correctAnswers":["The Festival of Lights"],"correctOptionIndexes":[1],"answerText":"Diwali is often called the Festival of Lights ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":5,"globalNumber":245,"question":"What is the Enlightenment?","options":["A period of total peace in England","A period when new ideas about politics, philosophy and science were developed","A period when England became the largest empire the world had ever seen","A period of economic recovery after the Second World War"],"sourceQuestionId":"p4","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["a period","when new ideas about politics, philosophy and science were developed"],"correctAnswers":["A period when new ideas about politics, philosophy and science were developed"],"correctOptionIndexes":[2],"answerText":"The Enlightenment was a period during the 18th century when new ideas about politics, philosophy and science were developed ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":6,"globalNumber":246,"question":"Which of the following charities helps the environment?","options":["NSPCC","Shelter","Friends of the Earth","Crisis"],"sourceQuestionId":"p5","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Friends of the Earth"],"correctAnswers":["Friends of the Earth"],"correctOptionIndexes":[3],"answerText":"Friends of the Earth is an environmental charity."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":7,"globalNumber":247,"question":"Which of the following was a crucial aerial battle fought between Germany and Britain during WWII?","options":["The Battle of Britain","The Battle of Worcester","The Battle of Dunbar","The Battle of Marston Moor"],"sourceQuestionId":"p6","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Battle of Britain"],"correctAnswers":["The Battle of Britain"],"correctOptionIndexes":[1],"answerText":"The correct answer is the Battle of Britain ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":8,"globalNumber":248,"question":"What was Margaret Thatcher famous for?","options":["She fought for the right to vote for women","She was the first woman Prime Minister of the UK","She set up the women’s Franchise League","She was the founder of modern nursing"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the first woman Prime Minister of the UK"],"correctAnswers":["She was the first woman Prime Minister of the UK"],"correctOptionIndexes":[2],"answerText":"Margaret Thatcher was the first woman Prime Minister of the UK ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":9,"globalNumber":249,"question":"Which two languages combined to become one English language?","options":["Latin","Anglo-Saxon","Proto-Celtic","Norman French"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Norman French","Anglo-Saxon"],"correctAnswers":["Anglo-Saxon","Norman French"],"correctOptionIndexes":[2,4],"answerText":"After the Norman Conquest, the king and his noblemen had spoken Norman French and the peasants had continued to speak Anglo-Saxon . Gradually these two languages combined to become one English language."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":10,"globalNumber":250,"question":"By law, radio and television coverage of the political parties must be balanced and so equal time has to be given to rival viewpoints.","options":["True","False"],"sourceQuestionId":"p9","optionAnswerIds":["r0","r1"],"rawCorrectAnswers":["true"],"correctAnswers":["True"],"correctOptionIndexes":[1],"answerText":"This statement is true ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":11,"globalNumber":251,"question":"Where did the Spanish Armada come from?","options":["France","Spain","Italy","South America"],"sourceQuestionId":"p10","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Spain"],"correctAnswers":["Spain"],"correctOptionIndexes":[2],"answerText":"In 1588 the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":12,"globalNumber":252,"question":"What is the name of the War Memorial located in Whitehall?","options":["Dumfries","Cenotaph","Royal Crescent","The White Tower"],"sourceQuestionId":"p11","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The Cenotaph"],"correctAnswers":["Cenotaph"],"correctOptionIndexes":[2],"answerText":"The Cenotaph is a war memorial located in Whitehall."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":13,"globalNumber":253,"question":"The UK government has never suspended the Northern Ireland Assembly.","options":["True","False"],"sourceQuestionId":"p12","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["False"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False . The Northern Ireland Assembly has been suspended on a few occasions."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":14,"globalNumber":254,"question":"What kind of church did Scotland establish in 1560?","options":["A Catholic church","A Protestant church"],"sourceQuestionId":"p13","optionAnswerIds":["r0","r1"],"rawCorrectAnswers":["A Protestant Church"],"correctAnswers":["A Protestant church"],"correctOptionIndexes":[2],"answerText":"In 1560, the predominantly Protestant Scottish Parliament abolished the authority of the Pope in Scotland and Roman Catholic religious services became illegal. A Protestant Church of Scotland with an elected leadership was established but, unlike in England, this was not a state Church."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":15,"globalNumber":255,"question":"When was the Domesday Book written?","options":["After the Viking invasion","After the Norman conquest","After the last Roman invasion","After the Anglo-Saxon invasion"],"sourceQuestionId":"p14","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["after the Norman Conquest"],"correctAnswers":["After the Norman conquest"],"correctOptionIndexes":[2],"answerText":"William the conqueror sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book, which gives a picture of society in England just after the Norman Conquest ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":16,"globalNumber":256,"question":"The Northern Ireland Assembly cannot make decisions on which two of the following issues?","options":["Immigration","Education","Agriculture","Defence"],"sourceQuestionId":"p15","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["immigration or defence"],"correctAnswers":["Immigration","Defence"],"correctOptionIndexes":[1,4],"answerText":"The Northern Ireland Assembly can make decisions on issues such as: education, agriculture, the environment health and social services, but it cannot make decisions on immigration or defence issues."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":17,"globalNumber":257,"question":"What should you do to make a complaint about the police (choose two answers)?","options":["Write a complaint letter to the House of Commons","Go to the Police station directly","Write to the Chief Constable of the police force involved","Write to your MP"],"sourceQuestionId":"p16","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["by going to a police station and writing to the Chief Constable of the police force involved"],"correctAnswers":["Go to the Police station directly","Write to the Chief Constable of the police force involved"],"correctOptionIndexes":[2,3],"answerText":"Anyone can make a complaint about the police by going to a police station and writing to the Chief Constable of the police force involved . Complaints can also be made to an independent body: the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland or the Police Ombudsman for Northern Ireland."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":18,"globalNumber":258,"question":"What flower did William Wordsworth write about?","options":["Rose","Daffodil","Thistle","Shamrock"],"sourceQuestionId":"p17","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["‘The Daffodils’"],"correctAnswers":["Daffodil"],"correctOptionIndexes":[2],"answerText":"William Wordsworth wrote ‘The Daffodils’ ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":19,"globalNumber":259,"question":"When is St Andrew’s day celebrated?","options":["17th April","31st December","1st March","30th November"],"sourceQuestionId":"p18","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["30th of November"],"correctAnswers":["30th November"],"correctOptionIndexes":[4],"answerText":"St Andrew’s day, patron of Scotland, is celebrated on the 30th of November ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":20,"globalNumber":260,"question":"Who was the architect that rebuilt Saint Paul’s cathedral after the Great Fire in 1666?","options":["Robert Adam","Sir Christopher Wren","Sir Norman Foster","Dame Zaha Hadid"],"sourceQuestionId":"p19","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Sir Christopher Wren"],"correctAnswers":["Sir Christopher Wren"],"correctOptionIndexes":[2],"answerText":"In 1666, a great fire destroyed much of the city, including many churches and St Paul’s Cathedral. London was rebuilt with a new St Paul\\\\\\\\\\\\\\'s, which was designed by a famous architect, Sir Christopher Wren ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":21,"globalNumber":261,"question":"When were the first coins in Britain made?","options":["The Stone Age","The Bronze Age","The Iron Age","The Middle Ages"],"sourceQuestionId":"p20","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Iron Age"],"correctAnswers":["The Iron Age"],"correctOptionIndexes":[3],"answerText":"The people of the Iron Age made the first coins to be minted in Britain."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":22,"globalNumber":262,"question":"Who was Emmeline Pankhurst?","options":["A suffragette","A nurse","A doctor","A scientist"],"sourceQuestionId":"p21","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["‘suffragettes’"],"correctAnswers":["A suffragette"],"correctOptionIndexes":[1],"answerText":"Emmeline Pankhurst was born in Manchester in 1858. She set up the women’s Franchise League in 1889, which fought to get the vote in local elections for married women. In 1903 she helped found the Women’s Social and Political Union (WSPU). This was the first group whose members were called ‘suffragettes’ ."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":23,"globalNumber":263,"question":"Who did Britain fight against in the Crimean War?","options":["Turkey","Russia","France","Germany"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Russia"],"correctAnswers":["Russia"],"correctOptionIndexes":[2],"answerText":"From 1853 to 1856, Britain fought with Turkey and France against Russia in the Crimean War."},{"exam":"exam-11","examTitle":"British Citizenship Test 11","examUrl":"https://lifeintheuktestweb.co.uk/audio-british-citizenship-test-11/","examQuestionNumber":24,"globalNumber":264,"question":"How old do you have to be to buy alcohol in the UK?","options":["17","18","19","20"],"sourceQuestionId":"p23","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["18"],"correctAnswers":["18"],"correctOptionIndexes":[2],"answerText":"It is a criminal offence to sell alcohol to anyone who is under 18 or to buy alcohol for people who are under the age of 18 . (There is one exception: people aged 16 or over can drink alcohol with a meal in a hotel or restaurant)."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":1,"globalNumber":265,"question":"Which of the following is a Crown Dependency but not part of the UK?","options":["Shetland","Isle of Wight","Isle of Man","Anglesey"],"sourceQuestionId":"p0","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Isle of Man"],"correctAnswers":["Isle of Man"],"correctOptionIndexes":[3],"answerText":"The Channel Islands and the Isle of Man are closely linked with the UK but are not part of it. They have their own governments and are called ‘Crown dependencies‘."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":2,"globalNumber":266,"question":"Is the BBC controlled by the government?","options":["Yes","No"],"sourceQuestionId":"p1","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["independent of government"],"correctAnswers":["No"],"correctOptionIndexes":[2],"answerText":"The BBC is the largest broadcaster in the world. It is the only wholly state-funded media organisation that is independent of government ."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":3,"globalNumber":267,"question":"How many members does the Northern Ireland Assembly have?","options":["12","60","90","108"],"sourceQuestionId":"p2","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["90"],"correctAnswers":["90"],"correctOptionIndexes":[3],"answerText":"The Northern Ireland Assembly has 90 elected members, known as MLAs (members of the Legislative Assembly)."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":4,"globalNumber":268,"question":"Who was in charge of the British fleet at the Battle of Trafalgar?","options":["Oliver Cromwell","The Duke of Wellington","Robert the Bruce","Admiral Nelson"],"sourceQuestionId":"p3","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Admiral Nelson"],"correctAnswers":["Admiral Nelson"],"correctOptionIndexes":[4],"answerText":"Admiral Nelson was in charge of the British fleet at Trafalgar and was killed in the battle."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheu
