group of MPs from the opposition?","options":["Roundheads","Cavaliers","Shadow Cabinet","Quakers"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["shadow cabinet"],"correctAnswers":["Shadow Cabinet"],"correctOptionIndexes":[3],"answerText":"Opposition MPs form the shadow cabinet and their role is to challenge the government and put forward alternative policies."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":24,"globalNumber":408,"question":"In which of the following matters can the Scottish Parliament legislate?","options":["Education","Immigration","Security","Defence"],"sourceQuestionId":"p23","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["education"],"correctAnswers":["Education"],"correctOptionIndexes":[1],"answerText":"The Scottish Parliament can legislate on: civil and criminal law, health, education , planning and additional tax-raising powers."}];
    const searchInput = document.getElementById('search');
    const examFilter = document.getElementById('exam-filter');
    const questionsContainer = document.getElementById('questions');
    const stats = document.getElementById('stats');
    const checkAllButton = document.getElementById('check-all');
    const toggleExplanationsButton = document.getElementById('toggle-explanations');
    const resetButton = document.getElementById('reset');
    const incorrectList = document.getElementById('incorrect-list');
    const timer = document.getElementById('timer');
    const tabQuiz = document.getElementById('tab-quiz');
    const tabIncorrect = document.getElementById('tab-incorrect');
    const panelQuiz = document.getElementById('panel-quiz');
    const panelIncorrect = document.getElementById('panel-incorrect');
    const scrollTopButton = document.getElementById('scroll-top');
    const sidebarToggle = document.getElementById('sidebar-toggle');

    let showAllExplanations = false;
    const questionState = new Map();
    let startedAt = Date.now();

    questions.forEach((question) => {
      questionState.set(question.globalNumber, {
        selected: [],
        checked: false,
        correct: null,
      });
    });

    function normalise(text) {
      return text.toLowerCase();
    }

    function isMultiAnswer(question) {
      return question.correctAnswers.length > 1 || /(two|TWO)/.test(question.question);
    }

    function getVisibleQuestions() {
      const query = normalise(searchInput.value.trim());
      const selectedExam = examFilter.value;

      return questions.filter((question) => {
        const matchesExam = selectedExam === 'all' || question.exam === selectedExam;
        const haystack = normalise([
          question.question,
          question.answerText,
          question.examTitle,
          ...question.options,
          ...question.correctAnswers,
        ].join(' '));
        const matchesSearch = !query || haystack.includes(query);
        return matchesExam && matchesSearch;
      });
    }

    function escapeHtmlClient(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderStats(visibleQuestions) {
      const uniqueExams = new Set(visibleQuestions.map((question) => question.exam));
      const visibleStates = visibleQuestions.map((question) => questionState.get(question.globalNumber));
      const checkedCount = visibleStates.filter((entry) => entry.checked).length;
      const incorrectCount = visibleStates.filter((entry) => entry.correct === false).length;
      const correctCount = visibleStates.filter((entry) => entry.correct === true).length;
      const pendingCount = visibleQuestions.length - checkedCount;
      stats.innerHTML = [
        '<span class="pill">Total questions: ' + questions.length + '</span>',
        '<span class="pill">Visible questions: ' + visibleQuestions.length + '</span>',
        '<span class="pill">Visible exams: ' + uniqueExams.size + '</span>',
        '<span class="pill">Completed: ' + checkedCount + '</span>',
        '<span class="pill">Correct: ' + correctCount + '</span>',
        '<span class="pill">Incorrectly selected: ' + incorrectCount + '</span>',
        '<span class="pill">Pending: ' + pendingCount + '</span>'
      ].join('');
    }

    function updateScrollTopVisibility() {
      scrollTopButton.classList.toggle('visible', window.scrollY > 320);
    }

    function renderIncorrectList() {
      const incorrectQuestions = questions.filter((question) => questionState.get(question.globalNumber).correct === false);

      if (incorrectQuestions.length === 0) {
        incorrectList.innerHTML = '<div class="empty">No incorrectly selected questions yet.</div>';
        return;
      }

      incorrectList.innerHTML = incorrectQuestions.map((question) => {
        const state = questionState.get(question.globalNumber);
        return '<article class="incorrect-item">' +
          '<div class="meta">#' + question.globalNumber + ' • ' + escapeHtmlClient(question.examTitle) + ' • Exam question ' + question.examQuestionNumber + '</div>' +
          '<p>' + escapeHtmlClient(question.question) + '</p>' +
          '<strong>Your selection</strong>' +
          '<div>' + (state.selected.length ? state.selected.map((value) => escapeHtmlClient(value)).join(', ') : 'No answer selected') + '</div>' +
          '<strong>Correct answer</strong>' +
          '<div>' + question.correctOptionIndexes.map((value) => escapeHtmlClient(question.options[value - 1])).join(', ') + '</div>' +
          '<strong>Explanation</strong>' +
          '<div>' + escapeHtmlClient(question.answerText) + '</div>' +
        '</article>';
      }).join('');
    }

    function updateTimer() {
      const elapsedMs = Date.now() - startedAt;
      const hours = Math.floor(elapsedMs / 3600000).toString().padStart(2, '0');
      const minutes = Math.floor((elapsedMs % 3600000) / 60000).toString().padStart(2, '0');
      const seconds = Math.floor((elapsedMs % 60000) / 1000).toString().padStart(2, '0');
      timer.textContent = hours + ':' + minutes + ':' + seconds;
    }

    function resetTimer() {
      startedAt = Date.now();
      updateTimer();
    }

    function setActiveTab(tab) {
      const quizActive = tab === 'quiz';
      tabQuiz.classList.toggle('active', quizActive);
      tabIncorrect.classList.toggle('active', !quizActive);
      panelQuiz.classList.toggle('active', quizActive);
      panelIncorrect.classList.toggle('active', !quizActive);
    }

    function setSidebarCollapsed(collapsed) {
      document.body.classList.toggle('sidebar-collapsed', collapsed);
      sidebarToggle.textContent = collapsed ? 'Open' : 'Hide';
      sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
    }

    function renderQuestions() {
      const visibleQuestions = getVisibleQuestions();
      renderStats(visibleQuestions);

      if (visibleQuestions.length === 0) {
        questionsContainer.innerHTML = '<div class="empty">No questions matched the current filter.</div>';
        return;
      }

      questionsContainer.innerHTML = visibleQuestions.map((question) => {
        const inputType = isMultiAnswer(question) ? 'checkbox' : 'radio';
        const needsManualCheck = isMultiAnswer(question);
        const state = questionState.get(question.globalNumber);
        const optionMarkup = question.options.map((option, index) => {
          const optionId = 'q-' + question.globalNumber + '-o-' + index;
          const checked = state.selected.includes(option) ? ' checked' : '';
          return '<label class="option" data-option-index="' + (index + 1) + '" data-option="' + escapeHtmlClient(option) + '">' +
            '<input type="' + inputType + '" name="q-' + question.globalNumber + '" value="' + escapeHtmlClient(option) + '" data-option-index="' + (index + 1) + '" id="' + optionId + '"' + checked + '>' +
            '<span>' + escapeHtmlClient(option) + '</span>' +
          '</label>';
        }).join('');

        const correctAnswersText = question.correctOptionIndexes.length
          ? question.correctOptionIndexes.map((index) => escapeHtmlClient(question.options[index - 1])).join(', ')
          : 'Not explicitly marked';

        const questionActions = needsManualCheck
          ? '<div class="question-actions"><button class="question-check-button secondary" type="button">Check answer</button></div>'
          : '';

        return '<article class="question-card" data-question-number="' + question.globalNumber + '">' +
          '<div class="question-meta">' +
            '<span class="pill">#' + question.globalNumber + '</span>' +
            '<span class="pill">' + escapeHtmlClient(question.examTitle) + '</span>' +
            '<span class="pill">Exam question ' + question.examQuestionNumber + '</span>' +
          '</div>' +
          '<p class="question-text">' + escapeHtmlClient(question.question) + '</p>' +
          '<div class="options">' + optionMarkup + '</div>' +
          questionActions +
          '<div class="answer-block' + (showAllExplanations || state.checked ? ' visible' : '') + '">' +
            '<strong>Expected answer:</strong>' +
            '<div>' + correctAnswersText + '</div>' +
            '<strong style="margin-top:12px;">Explanation:</strong>' +
            '<div>' + escapeHtmlClient(question.answerText) + '</div>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    function populateExamFilter() {
      const exams = Array.from(new Map(questions.map((question) => [question.exam, question.examTitle])).entries());
      examFilter.innerHTML = ['<option value="all">All exams</option>']
        .concat(exams.map(([exam, title]) => '<option value="' + escapeHtmlClient(exam) + '">' + escapeHtmlClient(title) + '</option>'))
        .join('');
    }

    function markQuestion(card) {
      const number = Number(card.dataset.questionNumber);
      const question = questions.find((entry) => entry.globalNumber === number);
      const selectedValues = Array.from(card.querySelectorAll('input:checked')).map((input) => input.value.trim());
      const selectedIndexes = Array.from(card.querySelectorAll('input:checked')).map((input) => Number(input.dataset.optionIndex));
      const correctIndexes = question.correctOptionIndexes.slice();
      const isCorrect = selectedIndexes.length === correctIndexes.length && selectedIndexes.every((value) => correctIndexes.includes(value));

      questionState.set(number, {
        selected: selectedValues,
        checked: true,
        correct: isCorrect,
      });

      card.querySelectorAll('.option').forEach((option) => {
        option.classList.remove('correct', 'incorrect');
        const optionIndex = Number(option.dataset.optionIndex);
        if (correctIndexes.includes(optionIndex)) {
          option.classList.add('correct');
        } else if (selectedIndexes.includes(optionIndex)) {
          option.classList.add('incorrect');
        }
      });

      card.querySelector('.answer-block').classList.add('visible');
      renderStats(getVisibleQuestions());
      renderIncorrectList();
    }

    function markAllVisibleQuestions() {
      document.querySelectorAll('.question-card').forEach(markQuestion);
    }

    function resetSelections() {
      questions.forEach((question) => {
        questionState.set(question.globalNumber, {
          selected: [],
          checked: false,
          correct: null,
        });
      });

      document.querySelectorAll('.question-card').forEach((card) => {
        card.querySelectorAll('input').forEach((input) => {
          input.checked = false;
        });
        card.querySelectorAll('.option').forEach((option) => {
          option.classList.remove('correct', 'incorrect');
        });
        card.querySelector('.answer-block').classList.toggle('visible', showAllExplanations);
      });

      renderStats(getVisibleQuestions());
      renderIncorrectList();
    }

    searchInput.addEventListener('input', renderQuestions);
    examFilter.addEventListener('change', () => {
      resetSelections();
      resetTimer();
      renderQuestions();
    });
    checkAllButton.addEventListener('click', markAllVisibleQuestions);
    toggleExplanationsButton.addEventListener('click', () => {
      showAllExplanations = !showAllExplanations;
      toggleExplanationsButton.textContent = showAllExplanations ? 'Hide all explanations' : 'Show all explanations';
      document.querySelectorAll('.answer-block').forEach((block) => {
        block.classList.toggle('visible', showAllExplanations);
      });
    });
    resetButton.addEventListener('click', resetSelections);
    tabQuiz.addEventListener('click', () => setActiveTab('quiz'));
    tabIncorrect.addEventListener('click', () => setActiveTab('incorrect'));
    sidebarToggle.addEventListener('click', () => {
      setSidebarCollapsed(!document.body.classList.contains('sidebar-collapsed'));
    });
    scrollTopButton.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    window.addEventListener('scroll', updateScrollTopVisibility, { passive: true });

    questionsContainer.addEventListener('change', (event) => {
      const card = event.target.closest('.question-card');
      if (card) {
        const number = Number(card.dataset.questionNumber);
        const question = questions.find((entry) => entry.globalNumber === number);
        const selectedValues = Array.from(card.querySelectorAll('input:checked')).map((input) => input.value.trim());
        const state = questionState.get(number);

        questionState.set(number, {
          selected: selectedValues,
          checked: state.checked,
          correct: state.correct,
        });

        if (!isMultiAnswer(question)) {
          markQuestion(card);
        }
      }
    });

    questionsContainer.addEventListener('click', (event) => {
      const button = event.target.closest('.question-check-button');
      if (!button) {
        return;
      }

      const card = button.closest('.question-card');
      if (card) {
        markQuestion(card);
      }
    });

    populateExamFilter();
    renderIncorrectList();
    renderQuestions();
    updateTimer();
    setSidebarCollapsed(false);
    updateScrollTopVisibility();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
