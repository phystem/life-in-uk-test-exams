ktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":5,"globalNumber":269,"question":"What was inscribed in the first coins to be minted in Britain during the Iron Age?","options":["The names of Iron Age kings","The names of Iron Age Gods","The names of trees","The names of animals"],"sourceQuestionId":"p4","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the names of Iron Age kings"],"correctAnswers":["The names of Iron Age kings"],"correctOptionIndexes":[1],"answerText":"The people of the Iron Age made the first coins to be minted in Britain, some inscribed with the names of Iron Age kings ."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":6,"globalNumber":270,"question":"Towns, cities and rural areas in the UK are governed by government appointed officials.","options":["True","False"],"sourceQuestionId":"p5","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["False","democratically elected councils"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False .Towns, cities and rural areas in the UK are governed by democratically elected councils , often called ‘local authorities‘."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":7,"globalNumber":271,"question":"Where is the Tate Art Gallery located?","options":["Glasgow","Cardiff","London","Belfast"],"sourceQuestionId":"p6","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["London"],"correctAnswers":["London"],"correctOptionIndexes":[3],"answerText":"The Tate Britain and Tate Modern are in London ."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":8,"globalNumber":272,"question":"The version of the Bible created by King James I is known as:","options":["Authorised version","Reformed version","Approved version","Unique version"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Authorised Version"],"correctAnswers":["Authorised version"],"correctOptionIndexes":[1],"answerText":"One achievement of King James‘ reign was a new translation of the Bible into English. This translation is known as the ‘King James Version‘ or the ‘ Authorised Version ‘."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":9,"globalNumber":273,"question":"What is the period of the 1960s known for?","options":["A downgrade in manufacturing","A growth in British fashion and pop music","A shortage of water","A blockage of social laws"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["growth in British fashion, cinema and popular music"],"correctAnswers":["A growth in British fashion and pop music"],"correctOptionIndexes":[2],"answerText":"The decade of the 1960s was a period of significant social change. It was known as the ‘Swinging Sixties’. There was growth in British fashion, cinema and popular music ."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":10,"globalNumber":274,"question":"Between 1680 and 1720 many refugees called Huguenots came to England, which country did they come from?","options":["Pakistan","Germany","India","France"],"sourceQuestionId":"p9","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["France"],"correctAnswers":["France"],"correctOptionIndexes":[4],"answerText":"Between 1680 and 1720 many refugees called Huguenots came from France ."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":11,"globalNumber":275,"question":"What is the most famous tennis tournament played in the UK?","options":["The Queen’s Club Championships","Wimbledon","Roland Garros","The Aegon Championships"],"sourceQuestionId":"p10","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The Wimbledon Championships"],"correctAnswers":["Wimbledon"],"correctOptionIndexes":[2],"answerText":"The most famous tournament hosted in Britain is The Wimbledon Championships , which takes place each year at the All England Lawn Tennis and Croquet Club."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":12,"globalNumber":276,"question":"MPs can only be contacted at their office in the House of Commons.","options":["True","False"],"sourceQuestionId":"p11","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["False","by letter or telephone at their constituency office, or at their office in the House of Commons"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False . You can contact MPs by letter or telephone at their constituency office, or at their office in the House of Commons . In addition, many MPs, SMs and MSPs hold regular local ‘surgeries‘, where constituents can go in person to talk about issues that are of concern to them."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":13,"globalNumber":277,"question":"What is the day when jokes are published in newspapers and telecast on TV?","options":["April Fool‘s Day","Boxing Day","Halloween","Valentine‘s Day"],"sourceQuestionId":"p12","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["April Fool‘s Day"],"correctAnswers":["April Fool‘s Day"],"correctOptionIndexes":[1],"answerText":"April Fool‘s Day , 1 April, is a day when people play jokes on each other until midday. The television and newspapers often have stories that are April Fool jokes."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":14,"globalNumber":278,"question":"Which Scottish king defeated the English at the Battle of Bannockburn?","options":["King Charles I","King James I","Admiral Nelson","Robert the Bruce"],"sourceQuestionId":"p13","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Robert the Bruce"],"correctAnswers":["Robert the Bruce"],"correctOptionIndexes":[4],"answerText":"In 1314 the Scottish, led by Robert the Bruce , defeated the English at the Battle of Bannockburn, and Scotland remained unconquered by the English."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":15,"globalNumber":279,"question":"Who invented the World Wide Web?","options":["Sir Tim Berners-Lee","Sir Peter Mansfield","Sir Ian Wilmot","Sir Robert Edwards"],"sourceQuestionId":"p14","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Sir Tim Berners-Lee"],"correctAnswers":["Sir Tim Berners-Lee"],"correctOptionIndexes":[1],"answerText":"The inventor of the World Wide Web was Sir Tim Berners-Lee ."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":16,"globalNumber":280,"question":"How are civil servants appointed and what political party do they belong to?","options":["They are chosen on merit and form part of the Liberal Democrats party","They are chosen randomly and form part of the Conservative party","They are chosen randomly and are politically neutral","They are chosen on merit and are politically neutral"],"sourceQuestionId":"p15","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["chosen on merit and are politically neutral"],"correctAnswers":["They are chosen on merit and are politically neutral"],"correctOptionIndexes":[4],"answerText":"Civil servants are chosen on merit and are politically neutral – they are not political appointees."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":17,"globalNumber":281,"question":"What is known as the “Dunkirk spirit”?","options":["When the German air force bombed London and other British cities at night-time","The evacuation of Allied soldiers from France during World War II","When new social classes appeared after the Black Death","The period when many refugees called Huguenots came from France"],"sourceQuestionId":"p16","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":[],"correctAnswers":["The evacuation of Allied soldiers from France during World War II"],"correctOptionIndexes":[2],"answerText":"During WWII as France fell, the British decided to evacuate British and French soldiers from France in a huge naval operation. Many civilian volunteers in small pleasure and fishing boats from Britain helped the Navy to rescue more than 300,000 men from the beaches around Dunkirk."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":18,"globalNumber":282,"question":"You have to be at least 21 years old to serve on a jury.","options":["True","False"],"sourceQuestionId":"p17","optionAnswerIds":["r0","r1"],"rawCorrectAnswers":["False","18"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False . Anyone who is on the electoral register and is aged 18 to 70 can serve on a jury."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":19,"globalNumber":283,"question":"If you wish to be a permanent resident or citizen of the UK, you should (choose TWO answers):","options":["Respect the rights of others, including their right to their own opinions","Buy a house in the UK","Look after yourself and your family","Marry a British citizen"],"sourceQuestionId":"p18","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["respect the rights of others, including their right to their own opinions, look after yourself and your family"],"correctAnswers":["Respect the rights of others, including their right to their own opinions","Look after yourself and your family"],"correctOptionIndexes":[1,3],"answerText":"If you wish to be a permanent resident or citizen of the UK, you should: respect the rights of others, including their right to their own opinions, look after yourself and your family , respect and obey the law, treat others with fairness and look after the area in which you live and the environment."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":20,"globalNumber":284,"question":"Which of the following major sports event took place in the UK in 2012?","options":["The Football World Cup","The Rugby World Cup","The Olympic games","The Eurocup Basketball"],"sourceQuestionId":"p19","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Olympic games"],"correctAnswers":["The Olympic games"],"correctOptionIndexes":[3],"answerText":"The UK has hosted the Olympic games on three occasions: 1908, 1948 and 2012."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":21,"globalNumber":285,"question":"Charles I believed in the ’Divine Right of Kings’ so he tried:","options":["To rule without the Parliament","To rule with the approval of the Parliament","To raise money for the Parliament","To restore Catholicism in Britain"],"sourceQuestionId":"p20","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["he tried to rule without the Parliament"],"correctAnswers":["To rule without the Parliament"],"correctOptionIndexes":[1],"answerText":"Charles I believed in the ’Divine Right of Kings’: the idea that the king was directly appointed by God to rule. He thought that the king should be able to act without having to seek approval from Parliament and he tried to rule without the Parliament ."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":22,"globalNumber":286,"question":"What is the Union Jack?","options":["The Flag of the Commonwealth","The Flag of the United Kingdom","The shield used by British Knights","A trade union to protect workers rights"],"sourceQuestionId":"p21","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Flag of the United Kingdom"],"correctAnswers":["The Flag of the United Kingdom"],"correctOptionIndexes":[2],"answerText":"The Union Flag, the Flag of the United Kingdom is also known as the Union Jack."},{"exam":"exam-12","examTitle":"British Citizenship Test 12","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-practice-questions-12/","examQuestionNumber":23,"globalNumber":287,"question":"Who was voted the greatest Briton of all time in 2002?","options":["Mo Farah","Admiral Nelson","Winston Churchill","Clement Attlee"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Winston Churchill"],"correctAnswers":["Winston Churchill"],"correctOptionIndexes":[3],"answerText":"In 2002 Winston Churchill was voted the greatest Briton of all time by the public."},{"exam":"exam-12","examTitle":"Briti against which foreign invaders?","options":["The Normands","The Vikings","The Anglo-Saxons","The Romans"],"sourceQuestionId":"p2","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Romans"],"correctAnswers":["The Romans"],"correctOptionIndexes":[4],"answerText":"One of the tribal leaders who fought against the Romans was Boudicca, the queen of the Iceni."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":4,"globalNumber":292,"question":"Which of the following poems is about a group of people going on a pilgrimage?","options":["The Canterbury Tales","All the world’s a stage","A Midsummer Night’s dream","Great Expectations"],"sourceQuestionId":"p3","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The Canterbury Tales"],"correctAnswers":["The Canterbury Tales"],"correctOptionIndexes":[1],"answerText":"Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage. The people decided to tell each other stories on the journey, and the poems describe the travellers and some of the stories they told. This collection of poems is called The Canterbury Tales ."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":5,"globalNumber":293,"question":"How are public holidays called?","options":["Bank Holidays","Workers Holidays","Business Holidays","Summer Holidays"],"sourceQuestionId":"p4","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["bank holidays"],"correctAnswers":["Bank Holidays"],"correctOptionIndexes":[1],"answerText":"There are public holidays each year called bank holidays , when banks and many other businesses are closed for the day."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":6,"globalNumber":294,"question":"How did Charles II manage to escape to Europe after his defeat in the Civil War?","options":["Hiding in a farmer’s house","Riding a horse","Hiding in an oak tree","Swimming"],"sourceQuestionId":"p5","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["hiding in an oak tree"],"correctAnswers":["Hiding in an oak tree"],"correctOptionIndexes":[3],"answerText":"Charles II escaped from Worcester, famously hiding in an oak tree on one occasion, and eventually fled to Europe."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":7,"globalNumber":295,"question":"Who defeated the Vikings?","options":["Harold","Edward I of England","King Arthur","King Alfred the Great"],"sourceQuestionId":"p6","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["King Alfred the Great"],"correctAnswers":["King Alfred the Great"],"correctOptionIndexes":[4],"answerText":"The Anglo-Saxon kingdoms in England united under King Alfred the Great , who defeated the Vikings."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":8,"globalNumber":296,"question":"Who was William Caxton?","options":["A poet who wrote about a group of people going to Canterbury on a pilgrimage","The first person in England to print books using a printing press","The first person to sail singlehanded around the world","The inventor of the television"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the first person in England to print books using a printing press"],"correctAnswers":["The first person in England to print books using a printing press"],"correctOptionIndexes":[2],"answerText":"William Caxton was the first person in England to print books using a printing press ."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":9,"globalNumber":297,"question":"Where do Beefeaters serve as tour guides?","options":["The Houses of the Parliament","The Tower of London","The O2","The Big Ben"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Tower of London"],"correctAnswers":["The Tower of London"],"correctOptionIndexes":[2],"answerText":"Beefeaters serve as tour guides at the Tower of London ."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":10,"globalNumber":298,"question":"During the rebellion of the clans in Scotland, Bonnie Prince Charlie was supported by clansmen from which Scottish region?","options":["Glasgow","Galloway","The Highlands","Edinburgh"],"sourceQuestionId":"p9","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Scottish Highlands"],"correctAnswers":["The Highlands"],"correctOptionIndexes":[3],"answerText":"Charles Edward Stuart (Bonnie Prince Charlie) was supported by clansmen from the Scottish Highlands ."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":11,"globalNumber":299,"question":"What religion did Elizabeth I follow?","options":["She was a Protestant","She was a Catholic"],"sourceQuestionId":"p10","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["protestant"],"correctAnswers":["She was a Protestant"],"correctOptionIndexes":[1],"answerText":"Elizabeth the I was a protestant ."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":12,"globalNumber":300,"question":"Who became famous for his tramp character in silent movies?","options":["Sir Rex Harrison","David Niven","Richard Burton","Charlie Chaplin"],"sourceQuestionId":"p11","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Charlie Chaplin"],"correctAnswers":["Charlie Chaplin"],"correctOptionIndexes":[4],"answerText":"Charlie Chaplin became famous in silent movies for his tramp character."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":13,"globalNumber":301,"question":"Which armed force was used in the Battle of Britain?","options":["The Royal Navy","The Police Force","The Naval Service","The Royal Air Force"],"sourceQuestionId":"p12","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Royal Air Force"],"correctAnswers":["The Royal Air Force"],"correctOptionIndexes":[4],"answerText":"The correct answer is the Royal Air Force ."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":14,"globalNumber":302,"question":"In the UK, you have to be 21 years old to be able to vote in a general election.","options":["True","False"],"sourceQuestionId":"p13","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["False","18"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False . The present voting age of 18 was set in 1969 and (with a few exceptions) all UK-born and naturalised adult citizens have the right to vote."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":15,"globalNumber":303,"question":"Which of the following poets was inspired by nature?","options":["John Masefield","Wilfred Owen","Siegfried Sassoon","William Wordsworth"],"sourceQuestionId":"p14","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["William Wordsworth"],"correctAnswers":["William Wordsworth"],"correctOptionIndexes":[4],"answerText":"British poets, including William Wordsworth , were inspired by nature."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":16,"globalNumber":304,"question":"Against which country did Britain fight at the Battle of Waterloo?","options":["Germany","Italy","France","Spain"],"sourceQuestionId":"p15","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["French"],"correctAnswers":["France"],"correctOptionIndexes":[3],"answerText":"In 1815, the French Wars ended with the defeat of the Emperor Napoleon by the Duke of Wellington at the Battle of Waterloo."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":17,"globalNumber":305,"question":"Who was William Wilberforce?","options":["A poet","A sportsman","A politician","A musician"],"sourceQuestionId":"p16","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":[],"correctAnswers":["A politician"],"correctOptionIndexes":[3],"answerText":"William Wilberforce, an evangelical Christian and a member of Parliament, also played an important part in changing the law. Along with other abolitionists (people who supported the abolition of slavery), he succeeded in turning public opinion against the slave trade."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":18,"globalNumber":306,"question":"Who is the spiritual leader of the Church of England?","options":["The Archbishop of Canterbury","The Archbishop of London","The Archbishop of Birmingham","The Archbishop of Manchester"],"sourceQuestionId":"p17","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Archbishop of Canterbury"],"correctAnswers":["The Archbishop of Canterbury"],"correctOptionIndexes":[1],"answerText":"The spiritual leader of the Church of England is the Archbishop of Canterbury ."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":19,"globalNumber":307,"question":"James I was King of which country before becoming King of England?","options":["Wales","Ireland","France","Scotland"],"sourceQuestionId":"p18","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["James VI of Scotland became King James I of England, Wales and Ireland"],"correctAnswers":["Scotland"],"correctOptionIndexes":[4],"answerText":"When Elizabeth I died, her cousin James VI of Scotland became King James I of England, Wales and Ireland and Scotland remained a separate country."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":20,"globalNumber":308,"question":"Which of the following statements is correct?","options":["Most shops in the UK open seven days a week.","All shops in the UK close on Sundays and bank holidays."],"sourceQuestionId":"p19","optionAnswerIds":["r1","r2"],"rawCorrectAnswers":[],"correctAnswers":["Most shops in the UK open seven days a week."],"correctOptionIndexes":[1],"answerText":"Most shops in the UK are open seven days a week, although trading hours on Sundays and public holidays are generally reduced."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":21,"globalNumber":309,"question":"Which country sent a fleet of ships to England in 1588?","options":["France","Germany","Spain","Italy"],"sourceQuestionId":"p20","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Spain"],"correctAnswers":["Spain"],"correctOptionIndexes":[3],"answerText":"Elizabeth became one of the most popular monarchs in English history, particularly after 1588, when the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":22,"globalNumber":310,"question":"Where is the National Horseracing Museum located?","options":["Edinburgh, Scotland","Newmarket, Suffolk","St Andrews, Scotland","Aintree near Liverpool"],"sourceQuestionId":"p21","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Newmarket, Suffolk"],"correctAnswers":["Newmarket, Suffolk"],"correctOptionIndexes":[2],"answerText":"There is a National Horseracing Museum in Newmarket, Suffolk ."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":23,"globalNumber":311,"question":"Which of the following castles is located in Scotland?","options":["Crathes Castle","Caernarfon Castle","Bodiam Castle","Powis Castle"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Crathes Castle"],"correctAnswers":["Crathes Castle"],"correctOptionIndexes":[1],"answerText":"Crathes Castle is located in Scotland."},{"exam":"exam-13","examTitle":"British Citizenship Test 13","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-13/","examQuestionNumber":24,"globalNumber":312,"question":"Who was a famous Art Deco ceramic designer?","options":["Alexander McQueen","Thomas Chippendale","Clarice Cliff","Mary Quant"],"sourceQuestionId":"p23","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Clarice Cliff"],"correctAnswers":["Clarice Cliff"],"correctOptionIndexes":[3],"answerText":"Britain has produced many great designers, from Thomas Chippendale (who designed furniture in the 18th century) to Clarice Cliff (who designed Art Deco ceramics) to Sir Terence Conran (a 20th-century interior designer)."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https tion":"When is Hogmanay celebrated?","options":["25th of December","2nd of January","1st of January","31st of December"],"sourceQuestionId":"p6","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the 31st of December"],"correctAnswers":["31st of December"],"correctOptionIndexes":[4],"answerText":"In Scotland, the 31st of December is called Hogmanay."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":8,"globalNumber":320,"question":"Proceedings in Parliament are broadcast on television and published in official reports known as:","options":["Canvassing","Hansard","Cabinets","Domesday Book"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Hansard"],"correctAnswers":["Hansard"],"correctOptionIndexes":[2],"answerText":"Proceedings in Parliament are broadcast on television and published in official reports called Hansard ."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":9,"globalNumber":321,"question":"Which of the following is a rugby competition?","options":["The Scottish Grand National","The Wimbledon Championships","The Ashes","The Six Nations Championship"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Six Nations Championship"],"correctAnswers":["The Six Nations Championship"],"correctOptionIndexes":[4],"answerText":"The most famous rugby union competition is the Six Nations Championship between England, Ireland, Scotland, Wales, France and Italy."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":10,"globalNumber":322,"question":"Who appoints life peers in the House of Lords?","options":["The Speaker","The Archbishop of Canterbury","The Prime Minister","The in what is now the English county of Wiltshire."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":14,"globalNumber":326,"question":"Who was the first Archbishop of Canterbury?","options":["St Patrick","St Augustine","St Andrew","St Columba"],"sourceQuestionId":"p13","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["St Augustine"],"correctAnswers":["St Augustine"],"correctOptionIndexes":[2],"answerText":"St Augustine led missionaries from Rome, who spread Christianity in the south. St Augustine became the first Archbishop of Canterbury."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":15,"globalNumber":327,"question":"How old do you have to be to go into betting shops or gambling clubs?","options":["18","20","16","21"],"sourceQuestionId":"p14","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["18"],"correctAnswers":["18"],"correctOptionIndexes":[1],"answerText":"You have to be 18 to go into betting shops or gambling clubs."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":16,"globalNumber":328,"question":"The system of government in the UK is a parliamentary democracy.","options":["True","False"],"sourceQuestionId":"p15","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["true"],"correctAnswers":["True"],"correctOptionIndexes":[1],"answerText":"This statement is true ."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":17,"globalNumber":329,"question":"What is the traditional food of Northern Ireland?","options":["Haggis","Pancakes","Paella","Ulster Fry"],"sourceQuestionId":"p16","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Ulster fry"],"correctAnswers":["Ulster Fry"],"correctOptionIndexes":[4],"answerText":"Ulster fry is the correct answer."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":18,"globalNumber":330,"question":"Who was elected as British Prime Minister in 1945?","options":["Clement Attlee","Winston Churchill","Harold Wilson","Harold Macmillan"],"sourceQuestionId":"p17","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Clement Attlee"],"correctAnswers":["Clement Attlee"],"correctOptionIndexes":[1],"answerText":"In 1945 the British people elected a Labour government. The new Prime Minister was Clement Attlee ."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":19,"globalNumber":331,"question":"How many times has the UK hosted the Olympic games?","options":["5","3","4","8"],"sourceQuestionId":"p18","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["three"],"correctAnswers":["3"],"correctOptionIndexes":[2],"answerText":"The UK has hosted the Olympic games on three occasions: 1908, 1948 and 2012."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":20,"globalNumber":332,"question":"Why were canals built during the Industrial Revolution?","options":["To link the factories to towns and cities and to the ports","To make space for the large fleet of British ships","To increase the number of water mills in the UK","To increase the amount of water in towns and cities"],"sourceQuestionId":"p19","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["to link the factories to towns and cities and to the ports"],"correctAnswers":["To link the factories to towns and cities and to the ports"],"correctOptionIndexes":[1],"answerText":"Canals were built to link the factories to towns and cities and to the ports , particularly in the new industrial areas in the middle and north of England."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":21,"globalNumber":333,"question":"Are civil servants appointed by the government?","options":["Yes","No"],"sourceQuestionId":"p20","optionAnswerIds":["r1","r2"],"rawCorrectAnswers":["Civil servants","are not political appointees"],"correctAnswers":["No"],"correctOptionIndexes":[2],"answerText":"Civil servants are accountable to ministers. They are chosen on merit and are politically neutral – they are not political appointees ."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":22,"globalNumber":334,"question":"Which of the following countries helped Britain to develop the Concorde?","options":["Germany","Norway","Italy","France"],"sourceQuestionId":"p21","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["France"],"correctAnswers":["France"],"correctOptionIndexes":[4],"answerText":"Britain and France developed the world’s only supersonic commercial airliner, Concorde."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":23,"globalNumber":335,"question":"Which invention led to the development of Britain during the Industrial Revolution?","options":["Magnetic Resonance Imaging","Steam power","Radar","Hovercraft"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["steam power"],"correctAnswers":["Steam power"],"correctOptionIndexes":[2],"answerText":"The Industrial Revolution was the rapid development of industry in Britain in the 18th and 19th centuries. Britain was the first country to industrialise on a large scale. It happened because of the development of machinery and the use of steam power ."},{"exam":"exam-14","examTitle":"British Citizenship Test 14","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-14/","examQuestionNumber":24,"globalNumber":336,"question":"Who was the tribal leader who fought against the Romans?","options":["Columba","Claudius","Hadrian","Boudicca"],"sourceQuestionId":"p23","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Boudicca"],"correctAnswers":["Boudicca"],"correctOptionIndexes":[4],"answerText":"One of the tribal leaders who fought against the Romans was Boudicca ."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":1,"globalNumber":337,"question":"Which two languages were used across England during the Middle Ages?","options":["Welsh","Gaelic","Norman French","Anglo-Saxon"],"sourceQuestionId":"p0","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Norman French","Anglo-Saxon"],"correctAnswers":["Norman French","Anglo-Saxon"],"correctOptionIndexes":[3,4],"answerText":"The Middle Ages saw the development of a national culture and identity. After the Norman Conquest, the king and his noblemen had spoken Norman French and the peasants had continued to speak Anglo-Saxon ."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":2,"globalNumber":338,"question":"In 1776, which British colonies declared their independence because they demanded that there should be ‘no taxation without representation‘.","options":["North African","Asian","North American","South African"],"sourceQuestionId":"p1","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["North American"],"correctAnswers":["North American"],"correctOptionIndexes":[3],"answerText":"In 1776, 13 North American colonies declared their independence, stating that people had a right to establish their own governments."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":3,"globalNumber":339,"question":"When was England ruled by a republic and not by a monarch?","options":["When Elizabeth I died without any successor","When Charles I was executed","When the Carta Magna restricted the king’s power","When kind Harold died after the Battle of Hastings"],"sourceQuestionId":"p2","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["When Charles I was executed"],"correctAnswers":["When Charles I was executed"],"correctOptionIndexes":[2],"answerText":"When Charles I was executed , England declared itself a republic, called the Commonwealth. It no longer had a monarch."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":4,"globalNumber":340,"question":"Which film produced in the UK was one of the most commercially successful films of all time and one of the highest-grossing film franchises?","options":["Harry Potter","Spider-man","The Lord of the Rings","Indiana Jones"],"sourceQuestionId":"p3","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Harry Potter"],"correctAnswers":["Harry Potter"],"correctOptionIndexes":[1],"answerText":"Some of the most commercially successful films of all time, including the two highest-grossing film franchises ( Harry Potter and James Bond), have been produced in the UK."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":5,"globalNumber":341,"question":"When did the first farmers come to Britain?","options":["10,000 years ago","6,000 years ago","15,000 years ago","2,000 years ago"],"sourceQuestionId":"p4","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["6,000 years ago"],"correctAnswers":["6,000 years ago"],"correctOptionIndexes":[2],"answerText":"The first farmers arrived in Britain 6,000 years ago ."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":6,"globalNumber":342,"question":"When did the First World War end?","options":["At 12.00 pm on 11th November 1914","At 12.00 pm on 11th November 1918","At 11.00 am on 11th November 1914","At 11.00 am on 11th November 1918"],"sourceQuestionId":"p5","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["at 11.00 am on 11th November 1918"],"correctAnswers":["At 11.00 am on 11th November 1918"],"correctOptionIndexes":[4],"answerText":"The First World War ended at 11.00 am on 11th November 1918 with victory for Britain and its allies."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":7,"globalNumber":343,"question":"Can court orders be obtained to protect a person from being forced into a marriage?","options":["Yes","No"],"sourceQuestionId":"p6","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["True"],"correctAnswers":["Yes"],"correctOptionIndexes":[1],"answerText":"True . Court orders can be obtained to protect a person from being forced into a marriage, or to protect a person in a forced marriage."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":8,"globalNumber":344,"question":"What medal did Mary Peters win in the 1972 Olympics?","options":["She did not win any medals","Silver","Gold","Bronze"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["an Olympic gold medal"],"correctAnswers":["Gold"],"correctOptionIndexes":[3],"answerText":"Born in Manchester, Mary Peters moved to Northern Ireland as a child. She was a talented athlete who won an Olympic gold medal in the pentathlon in 1972."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":9,"globalNumber":345,"question":"In England, Wales and Northern Ireland Youth Court cases are normally heard by (choose TWO answers)?","options":["Up to 3 specially trained magistrates","A District Judge","A sheriff","Up to 5 specially trained magistrates"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["up to three specially trained magistrates or a District Judge"],"correctAnswers":["Up to 3 specially trained magistrates","A District Judge"],"correctOptionIndexes":[1,2],"answerText":"In England, Wales and Northern Ireland, if an accused person is aged 10 to 17, the case is normally heard in a Youth Court in front of up to three specially trained magistrates or a District Judge ."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":10,"globalNumber":346,"question":"What was invented by Alan Turing in the 1930s?","options":["The jet engine","The television","The Turing machine","The ball pen"],"sourceQuestionId":"p9","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Turing machine"],"correctAnswers":["The Turing machine"],"correctOptionIndexes":[3],"answerText":"A Turing machine is a theoretical mathematical device invented by Alan Turing (1912-54), a British mathematician, in the 1930s."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":11,"globalNumber":347,"question":"Which of the following tells us about how people lived in England just after the Norman Conquest?","options":["The Domesday Book","The Book of Common Prayer","The Canterbury Tales","The Carta Magna"],"sourceQuestionId":"p10","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Domesday Book"],"correctAnswers":["The Domesday Book"],"correctOptionIndexes":[1],"answerText":"William sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book . It still exists today and gives a picture of society in England just after the Norman Conquest."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":12,"globalNumber":348,"question":"Who led a team of scientists to ‘split the atom‘ for the first time?","options":["Alexander Fleming","Alan Turing","Ernest Rutherford","Sir Peter Mansfield"],"sourceQuestionId":"p11","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Ernest Rutherford"],"correctAnswers":["Ernest Rutherford"],"correctOptionIndexes":[3],"answerText":"Scientists led by Ernest Rutherford , working at Manchester and then Cambridge University, were the first to ‘split the atom‘ and took part in the Manhattan Project in the United States, which developed the atomic bomb."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":13,"globalNumber":349,"question":"What song is sung by people in the UK and other countries when they are celebrating the New Year?","options":["Auld Lang Syne","The British Anthem","Jingle Bells","White Christmas"],"sourceQuestionId":"p12","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The song Auld Lang Syne"],"correctAnswers":["Auld Lang Syne"],"correctOptionIndexes":[1],"answerText":"The song Auld Lang Syne , which is sung by people in the UK and other countries when they are celebrating the New Year (or Hogmanay as it is called in Scotland)."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":14,"globalNumber":350,"question":"Who fought in the English Civil war of 1642?","options":["The House of York and the House of Lancaster","The Anglo-Saxons and the Vikings","The Cavaliers and the Roundheads","The House of Fraser and the House of Stuart"],"sourceQuestionId":"p13","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Cavaliers","the Roundheads"],"correctAnswers":["The Cavaliers and the Roundheads"],"correctOptionIndexes":[3],"answerText":"The Civil war between the king and Parliament began in 1642. The country split into those who supported the king ( the Cavaliers ) and those who supported Parliament ( the Roundheads )."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":15,"globalNumber":351,"question":"Which two of these forts were part of Hadrian‘s wall?","options":["Vindolanda","Maiden Castle","Housesteads","Grimsby"],"sourceQuestionId":"p14","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Housesteads and Vindolanda"],"correctAnswers":["Vindolanda","Housesteads"],"correctOptionIndexes":[1,3],"answerText":"Parts of Hadrian‘s Wall, include the forts of Housesteads and Vindolanda ."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":16,"globalNumber":352,"question":"What was the religion of the Puritans?","options":["Hindu","Catholic","Sikh","Protestant"],"sourceQuestionId":"p15","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Protestants"],"correctAnswers":["Protestant"],"correctOptionIndexes":[4],"answerText":"The Puritans were a group of Protestants who advocated strict and simple religious doctrine and worship."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":17,"globalNumber":353,"question":"What is the name of Irish people who favoured complete independence from the UK in the 19th century?","options":["Fenians","Quakers","Highlanders","Suffragettes"],"sourceQuestionId":"p16","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Fenians"],"correctAnswers":["Fenians"],"correctOptionIndexes":[1],"answerText":"The Irish Nationalist movement had grown strongly through the 19th century. Some, such as the Fenians , favoured complete independence."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":18,"globalNumber":354,"question":"Which two British pop music groups were famous during the Swinging Sixties?","options":["The Rolling Stones","The Beatles","ABBA","Radiohead"],"sourceQuestionId":"p17","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The Beatles","The Rolling Stones"],"correctAnswers":["The Rolling Stones","The Beatles"],"correctOptionIndexes":[1,2],"answerText":"The decade of the 1960s was a period of significant social change. It was known as the ‘swinging sixties’. There was growth in British fashion, cinema and popular music. Two well-known pop music groups at the time were The Beatles and The Rolling Stones ."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":19,"globalNumber":355,"question":"What is the minimum age required to drive a motorcycle?","options":["16 years old","17 years old","18 years old","21 years old"],"sourceQuestionId":"p18","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["17"],"correctAnswers":["17 years old"],"correctOptionIndexes":[2],"answerText":"In the UK, you must be at least 17 years to drive a car or motorcycle and you must have a driving licence to drive on public roads."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":20,"globalNumber":356,"question":"The members of the House of Lords, known as peers, are elected by the people.","options":["True","False"],"sourceQuestionId":"p19","optionAnswerIds":["r0","r1"],"rawCorrectAnswers":["False","are not elected by the people"],"correctAnswers":["False"],"correctOptionIndexes":[2],"answerText":"False . The members of the House of Lords, known as peers, are not elected by the people ."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":21,"globalNumber":357,"question":"When did the Emancipation Act abolish slavery throughout the British Empire?","options":["1835","1823","1807","1833"],"sourceQuestionId":"p20","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["1833"],"correctAnswers":["1833"],"correctOptionIndexes":[4],"answerText":"In 1833 the Emancipation Act abolished slavery throughout the British Empire."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":22,"globalNumber":358,"question":"Who is responsible for crime, policing and immigration?","options":["The Chancellor of the Exchequer","The Foreign Secretary","The Speaker","The Home Secretary"],"sourceQuestionId":"p21","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The Home Secretary"],"correctAnswers":["The Home Secretary"],"correctOptionIndexes":[4],"answerText":"The Home Secretary is responsible for crime, policing and immigration."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":23,"globalNumber":359,"question":"What kind of genre was the film Wallace and Gromit created by Nick Park?","options":["A soap opera","A silent movie","An animated film","An action film"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["animated films"],"correctAnswers":["An animated film"],"correctOptionIndexes":[3],"answerText":"Nick Park won four Oscars for his animated films , including three for films featuring Wallace and Gromit."},{"exam":"exam-15","examTitle":"British Citizenship Test 15","examUrl":"https://lifeintheuktestweb.co.uk/british-citizenship-test-15/","examQuestionNumber":24,"globalNumber":360,"question":"Anyone who is violent towards their partner – whether they are a man or a woman, married or living together – can be prosecuted.","options":["True","False"],"sourceQuestionId":"p23","optionAnswerIds":["r0","r2"],"rawCorrectAnswers":["True"],"correctAnswers":["True"],"correctOptionIndexes":[1],"answerText":"True . Anyone who is violent towards their partner – whether they are a man or a woman, married or living together – can be prosecuted."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":1,"globalNumber":361,"question":"When was the United Nations set up?","options":["After the First World War.","After the Second World War.","Before the First World War.","Before the Second World War."],"sourceQuestionId":"p0","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["after the Second World War"],"correctAnswers":["After the Second World War."],"correctOptionIndexes":[2],"answerText":"The UN was set up after the Second World War and aims to prevent war and promote international peace and security."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":2,"globalNumber":362,"question":"Where is the Giant’s Causeway located?","options":["Scotland","England","Wales","Northern Ireland"],"sourceQuestionId":"p1","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["on the north-east coast of Northern Ireland"],"correctAnswers":["Northern Ireland"],"correctOptionIndexes":[4],"answerText":"The Giant’s Causeway is a land formation of columns made from volcanic lava located on the north-east coast of Northern Ireland . It was formed about 50 million years ago. There are many legends about the Causeway and how it was formed."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":3,"globalNumber":363,"question":"What happened to Mary, Queen of Scots, after being sent to prison for 20 years by her cousin Queen Elizabeth I?","options":["She got married.","She was sent to France.","She was executed.","She was sent to Scotland."],"sourceQuestionId":"p2","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Mary was executed"],"correctAnswers":["She was executed."],"correctOptionIndexes":[3],"answerText":"Mary was executed , accused of plotting against Elizabeth I."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":4,"globalNumber":364,"question":"Which tribe came to Britain from northern Europe after the Romans left in AD 410?","options":["The Gepids","The Jutes","The Frisians","The Burgundians"],"sourceQuestionId":"p3","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the Jutes,"],"correctAnswers":["The Jutes"],"correctOptionIndexes":[2],"answerText":"Britain was invaded by tribes from northern Europe: the Jutes, the Angles and the Saxons."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":5,"globalNumber":365,"question":"What is one of the highest-grossing film franchises produced in the UK?","options":["James Bond","Star Wars","The Lord of the Rings","Superman"],"sourceQuestionId":"p4","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["James Bond"],"correctAnswers":["James Bond"],"correctOptionIndexes":[1],"answerText":"Some of the most commercially successful films of all time, including the two highest-grossing film franchises (Harry Potter and James Bond ), have been produced in the UK."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":6,"globalNumber":366,"question":"Who can hear cases in Youth Courts in England, Wales and Northern Ireland (two answers)?","options":["Specially trained magistrates.","Social workers.","District judges.","Members of the public."],"sourceQuestionId":"p5","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["up to three specially trained magistrates or a District Judge"],"correctAnswers":["Specially trained magistrates.","District judges."],"correctOptionIndexes":[1,3],"answerText":"In England, Wales and Northern Ireland, if an accused person is aged 10 to 17, the case is normally heard in a Youth Court in front of up to three specially trained magistrates or a District Judge . The most serious cases will go the Crown Court. The parents or carers of the young person are expected to attend the hearing. Members of the public are not allowed in Youth Courts, and the name or photographs of the accused young person cannot be published in newspapers or used by the media."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":7,"globalNumber":367,"question":"Who came from the Netherlands to become the British monarch?","options":["William II","Charles II","Edward II","George II"],"sourceQuestionId":"p6","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Charles II"],"correctAnswers":["Charles II"],"correctOptionIndexes":[2],"answerText":"In May 1660, Parliament invited Charles II to come back from exile in the Netherlands. He was crowned King Charles II of England, Wales, Scotland and Ireland."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":8,"globalNumber":368,"question":"Who can apply for the National Citizen Service programme?","options":["14- and 15-year-olds","15- and 16-year-olds","16- and 17-year-olds","17- and 18-year-olds"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["16- and 17-year-olds"],"correctAnswers":["16- and 17-year-olds"],"correctOptionIndexes":[3],"answerText":"The National Citizen Service programme gives 16- and 17-year-olds the opportunity to enjoy outdoor activities, develop their skills and take part in a community project."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":9,"globalNumber":369,"question":"Nick Park has won four Oscars for his animated films, including three for films featuring:","options":["Chariots of Fire","Wallace and Gromit","Four Weddings and a Funeral","Women in Love"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Wallace and Gromit"],"correctAnswers":["Wallace and Gromit"],"correctOptionIndexes":[2],"answerText":"Nick Park, who has won four Oscars for his animated films, including three for films featuring Wallace and Gromit ."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":10,"globalNumber":370,"question":"Who was the British scientist who co-discovered the structure of the DNA molecule in the 1950s?","options":["Sir Ian Wilmot","Keith Campbell","James Watt","Francis Crick"],"sourceQuestionId":"p9","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Francis Crick"],"correctAnswers":["Francis Crick"],"correctOptionIndexes":[4],"answerText":"The structure of the DNA molecule was discovered in 1953 through work at British universities in London and Cambridge. This discovery contributed to many scientific advances, particularly in medicine and fighting crime. Francis Crick (1916-2004), was one of those awarded the Nobel Prize for this discovery."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":11,"globalNumber":371,"question":"What percentage of the UK population has a parent or grandparent born outside of the UK?","options":["Around 5%","Around 10%","Around 15%","Around 20%"],"sourceQuestionId":"p10","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Nearly 10%"],"correctAnswers":["Around 10%"],"correctOptionIndexes":[2],"answerText":"Nearly 10% of the population has a parent or grandparent born outside the UK."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":12,"globalNumber":372,"question":"How old do you have to be to drive a moped in the UK?","options":["15 years old","16 years old","17 years old","18 years old"],"sourceQuestionId":"p11","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["16 years old"],"correctAnswers":["16 years old"],"correctOptionIndexes":[2],"answerText":"In the UK, you need to be at least 16 years old to ride a moped, and there are other age requirements and special tests for driving large vehicles."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":13,"globalNumber":373,"question":"Who was the leader of the Labour Party who introduced a Scottish Parliament and a Welsh Assembly?","options":["James Callaghan","Clement Attlee","Gordon Brown","Tony Blair"],"sourceQuestionId":"p12","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Tony Blair"],"correctAnswers":["Tony Blair"],"correctOptionIndexes":[4],"answerText":"In 1997 the Labour Party led by Tony Blair was elected. The Blair government introduced a Scottish Parliament and a Welsh Assembly."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":14,"globalNumber":374,"question":"What is the maximum amount you can claim through the small claims procedure in Scotland and Northern Ireland?","options":["£3,000","£5,000","£8,000","£10,000"],"sourceQuestionId":"p13","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["£5,000 in Scotland and Northern Ireland"],"correctAnswers":["£5,000"],"correctOptionIndexes":[2],"answerText":"The small claims procedure is an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer. This procedure is used for claims of less than £10,000 in England and Wales, £5,000 in Scotland and Northern Ireland ."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":15,"globalNumber":375,"question":"Which historical monument did William the Conqueror build?","options":["St Paul’s Cathedral","The Cenotaph","Dumfries House","The White Tower"],"sourceQuestionId":"p14","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["The White Tower"],"correctAnswers":["The White Tower"],"correctOptionIndexes":[4],"answerText":"The White Tower in the Tower of London is an example of a Norman castle keep, built on the orders of William the Conqueror."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":16,"globalNumber":376,"question":"Who became Prime Minister after Margaret Thatcher and played an important part in the Northern Ireland peace process?","options":["James Callaghan","John Major","Tony Blair","Harold Wilson"],"sourceQuestionId":"p15","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["John Major"],"correctAnswers":["John Major"],"correctOptionIndexes":[2],"answerText":"John Major became Prime Minister after Margaret Thatcher and played an important part in the Northern Ireland peace process."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":17,"globalNumber":377,"question":"Who should you contact to report a terrorist activity?","options":["Your local Council.","Your local MP.","Your local police force.","The Prime Minister."],"sourceQuestionId":"p16","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["your local police force"],"correctAnswers":["Your local police force."],"correctOptionIndexes":[3],"answerText":"If you think someone is trying to persuade you to join an extremist or terrorist cause, you should notify your local police force ."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":18,"globalNumber":378,"question":"Which Paralympic athlete has won gold medals for swimming at the 2008, 2012 and 2016 Paralympic Games?","options":["Sophie Christiansen","Ellie Simmonds","Baroness Tanni Grey-Thompson","David Weir"],"sourceQuestionId":"p17","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Ellie Simmonds"],"correctAnswers":["Ellie Simmonds"],"correctOptionIndexes":[2],"answerText":"Ellie Simmonds is a Paralympian who won gold medals for swimming at the 2008, 2012 and 2016 Paralympic Games and holds a number of world records. She was the youngest member of the British team at the 2008 Games."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":19,"globalNumber":379,"question":"Each of the UK countries is associated with a flower symbol, which country is associated with the rose?","options":["Wales","Northern Ireland","Scotland","England"],"sourceQuestionId":"p18","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["England – the rose"],"correctAnswers":["England"],"correctOptionIndexes":[4],"answerText":"The countries that make up the UK all have flowers which are particularly associated with them and which are sometimes worn on national saints’ days. The flowers associated to each country are as follows: England – the rose , Scotland – the thistle, Wales – the daffodil and Northern Ireland – the shamrock."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":20,"globalNumber":380,"question":"Isambard Kingdom Brunel was responsible for:","options":["The construction of the Great Western Railway.","The invention of the television.","The construction of the Tower of London.","The discovery of insulin."],"sourceQuestionId":"p19","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["constructing the Great Western Railway"],"correctAnswers":["The construction of the Great Western Railway."],"correctOptionIndexes":[1],"answerText":"Brunel was originally from Portsmouth, England. He was an engineer who built tunnels, bridges, railway lines and ships. He was responsible for constructing the Great Western Railway , which was the first major railway built in Britain. It runs from Paddington Station in London to the south west of England, the West Midlands and Wales."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":21,"globalNumber":381,"question":"What is the Commonwealth?","options":["An organization responsible for the protection and promotion of human rights in its member countries.","A group of European and North American countries that have agreed to help each other if they come under attack.","An association of countries that support each other and work together towards shared goals in democracy and development.","An international organization that aims to prevent war and promote international peace and security."],"sourceQuestionId":"p20","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["an association of countries that support each other and work together towards shared goals in democracy and development."],"correctAnswers":["An association of countries that support each other and work together towards shared goals in democracy and development."],"correctOptionIndexes":[3],"answerText":"The Commonwealth is an association of countries that support each other and work together towards shared goals in democracy and development. Most member states were once part of the British Empire, although a few countries which were not have also joined."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":22,"globalNumber":382,"question":"Under which name was the movement of opinion against the authority of the Pope during the times of Henry VIII known?","options":["The Spanish Inquisition","The Holy Wars","The Reformation","The Enlightenment"],"sourceQuestionId":"p21","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Reformation."],"correctAnswers":["The Reformation"],"correctOptionIndexes":[3],"answerText":"The correct answer is the Reformation."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":23,"globalNumber":383,"question":"What did Isaac Newton discover?","options":["Gravity","Penicillin","Insulin","Lightbulb"],"sourceQuestionId":"p22","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["gravity"],"correctAnswers":["Gravity"],"correctOptionIndexes":[1],"answerText":"Newton’s most famous published work was Philosophiae Naturalis Principia Mathematica (‘Mathematical Principle of Natural Philosophy’), which showed how gravity applied to the whole universe. Newton also discovered that white light is made up of the colours of the rainbow."},{"exam":"exam-16","examTitle":"Life in the UK Exam 16 NEW!","examUrl":"https://lifeintheuktestweb.co.uk/life-in-the-uk-exam-16/","examQuestionNumber":24,"globalNumber":384,"question":"What kind of movies did Academy Award winner Nick Park specialise in?","options":["Action movies","Animated movies","Thrillers","Horror movies"],"sourceQuestionId":"p23","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["animated films"],"correctAnswers":["Animated movies"],"correctOptionIndexes":[2],"answerText":"Britain continues to be particularly strong in special effects and animation. One example is the work of Nick Park, who has won four Oscars for his animated films , including three for films featuring Wallace and Gromit."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":1,"globalNumber":385,"question":"Which of the following is not a constitutional institution?","options":["The Parliament","The cabinet","The armed forces","The police"],"sourceQuestionId":"p0","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["armed forces"],"correctAnswers":["The armed forces"],"correctOptionIndexes":[3],"answerText":"Constitutional institutions in the UK include: the monarchy, the Parliament (the House of Commons and the House of Lords), the Prime Minister, the cabinet, the judiciary (courts), the police, the civil service and the local government. The armed forces are not a constitutional institution."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":2,"globalNumber":386,"question":"What food shortage caused the famine in Ireland?","options":["Corn","Potato","Wheat","Oats"],"sourceQuestionId":"p1","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the potato"],"correctAnswers":["Potato"],"correctOptionIndexes":[2],"answerText":"In the middle of the century the potato crop failed, and Ireland suffered a famine. A million people died from disease and starvation."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":3,"globalNumber":387,"question":"The leader of the opposition appoints senior opposition MPs. They form a group whose role is to challenge the government and put forward alternative policies. What are they called?","options":["Shadow Cabinet","Lobby groups","Civil servants","Support peers"],"sourceQuestionId":"p2","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["the shadow cabinet"],"correctAnswers":["Shadow Cabinet"],"correctOptionIndexes":[1],"answerText":"The leader of the opposition appoints senior opposition MPs to be ‘shadow ministers’. Their role is to challenge the government and put forward alternative policies. They form the shadow cabinet ."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":4,"globalNumber":388,"question":"Which of the following are TWO responsibilities of the MPs?","options":["Protect life and property","Represent everyone in their constituency","Help to create new laws","Scrutinise and comment on what the monarch is doing"],"sourceQuestionId":"p3","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["to represent everyone in their constituency, to help to create new laws"],"correctAnswers":["Represent everyone in their constituency","Help to create new laws"],"correctOptionIndexes":[2,3],"answerText":"MPs responsibilities include: to represent everyone in their constituency, to help to create new laws , to scrutinise and comment on what the government is doing and to debate important national issues."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":5,"globalNumber":389,"question":"Who was the longest serving PM in the 20th century?","options":["John Major","Sir Alec Douglas-Home","Robert Walpole","Margaret Thatcher"],"sourceQuestionId":"p4","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["Margaret Thatcher"],"correctAnswers":["Margaret Thatcher"],"correctOptionIndexes":[4],"answerText":"Margaret Thatcher was the first woman Prime Minister of the UK. She was the longest-serving Prime Minister of the 20th century, remaining in office from 1979 until 1990."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":6,"globalNumber":390,"question":"What name is given to the territories which are linked to the UK but not part of it?","options":["Crown Dependencies","Offshore Territories","Crown Independencies","British Colonies"],"sourceQuestionId":"p5","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["‘Crown dependencies’"],"correctAnswers":["Crown Dependencies"],"correctOptionIndexes":[1],"answerText":"There are several islands which are closely linked with the UK but are not part of it: the Channel Islands and the Isle of Man. These have their own governments and are called ‘Crown dependencies’ ."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":7,"globalNumber":391,"question":"What area did David Hume contribute to during the Enlightenment?","options":["Architecture","Poetry","Cinema","Philosophy"],"sourceQuestionId":"p6","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["a famous philosopher"],"correctAnswers":["Philosophy"],"correctOptionIndexes":[4],"answerText":"David Hume was a famous philosopher who developed ideas about human nature during the 18th century and that have continued to influence philosophers over the years."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":8,"globalNumber":392,"question":"What proportion of the population died as a result of the Black Death in England?","options":["Half of the population","One third of the population","55% of the population","One quarter of the population"],"sourceQuestionId":"p7","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["one third of the population of England"],"correctAnswers":["One third of the population"],"correctOptionIndexes":[2],"answerText":"As a result of the Black Death, one third of the population of England died and a similar proportion in Scotland and Wales."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":9,"globalNumber":393,"question":"What happened to Charles I after he was in prison?","options":["He moved to Spain","He became a priest","He escaped to France","He was executed"],"sourceQuestionId":"p8","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":["he was executed"],"correctAnswers":["He was executed"],"correctOptionIndexes":[4],"answerText":"Charles I’s army was defeated at the Battles of Marston Moor and Naseby. Charles was held prisoner by the parliamentary army. As he was unwilling to reach any agreement with the Parliament, in 1649 he was executed ."},{"exam":"exam-17","examTitle":"NEW Exam 17","examUrl":"https://lifeintheuktestweb.co.uk/exam-17/","examQuestionNumber":10,"globalNumber":394,"question":"What are TWO responsibilities of the monarch?","options":["To appoint the members of the cabinet","To advise, warn and encourage the Prime Minister‘s decisions on government policies","To debate important national issues","To appoint the government"],"sourceQuestionId":"p9","optionAnswerIds":["r0","r1","r2","r3"],"rawCorrectAnswers":[],"correctAnswers":["To advise, warn and encourage the Prime Minister‘s decisions on government
